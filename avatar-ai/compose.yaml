services:
  avatar:
    build: .
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      GMS_KEY: ${GMS_KEY:?GMS_KEY must be set}
      GMS_BASE_URL: ${GMS_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2.5-sunburst}
      VISION_MODEL: ${VISION_MODEL:-gpt-4.1-mini}
      IMAGE_QUALITY: ${IMAGE_QUALITY:-high}
      AI_CALLBACK_URL: ${AI_CALLBACK_URL:-}
      AI_CALLBACK_TOKEN: ${AI_CALLBACK_TOKEN:-}
      HEAD_PNG_COMPRESSION: ${HEAD_PNG_COMPRESSION:-off}
    expose:
      - "3000"
    volumes:
      - avatar-data:/app/data
    networks:
      - avatar-internal
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)});if(!r.ok||!(await r.json()).ok)process.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
networks:
  avatar-internal:
    external: true
    name: ${AVATAR_NETWORK:-runkk-ai-avatar}
volumes:
  avatar-data:
