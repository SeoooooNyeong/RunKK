[project]
name = "runkk-outfit-pipeline"
version = "0.1.0"
description = "런크크 아바타 의상 자산 파이프라인: riv UV 마스크, 슬롯 템플릿, 규격 검사, 묶음 빌드(design-oo 05-30 5절)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow==12.0.0",
    "numpy==2.3.4",
]

[project.scripts]
outfit-pipeline = "outfit_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outfit_pipeline"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # 한국어 주석은 폭 2로 세어 넘친다(코드 줄은 format이 맞춘다)

[tool.pytest.ini_options]
testpaths = ["tests"]
