# 시나리오 2: 홈(v0.14, 피그마 A-1)이 새 계정 값으로 뜨고 오류 문구("다시 시도")가 없다.
# 머리(닉네임·"[티어], Lv.[n]"), 리워드 잔액, 이번 주 막대(0km), 자유런·배틀런 카드, 알림함 버튼을 확인한다.
