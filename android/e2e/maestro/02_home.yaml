# 시나리오 2: 홈 대시보드가 0 값으로 뜨고 오류 문구("다시 시도")가 없다.
appId: ${APP_ID}
name: 02_home
tags: [smoke]
---
- launchApp
- extendedWaitUntil:
    visible: "자유런 시작"
    timeout: 20000
- assertVisible: "0.00 KM"
- assertVisible: "오늘 달린 거리 0.00킬로미터, 아직 달리지 않았어요"
- assertVisible: "UNRANKED, Lv.1"
- assertVisible: "이번 주 목표 목표를 정해 보세요"
- assertNotVisible: "다시 시도"
- takeScreenshot: 02_home_dashboard
