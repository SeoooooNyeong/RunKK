# 시나리오 2: 홈 대시보드가 0 값으로 뜨고 오류 문구("다시 시도")가 없다.
appId: ${APP_ID}
name: 02_home
tags: [smoke]
---
- launchApp
- extendedWaitUntil:
    visible: "자유런 시작"
    timeout: 20000
- assertVisible: "자유런 시작"
- assertVisible: "0.00 KM"
- assertVisible: "오늘 0.00킬로미터, 아직 달리지 않았어요"
- assertVisible: "UNRANKED · Lv.1"
- assertNotVisible: "다시 시도"
- scrollUntilVisible:
    element: "스트릭"
    direction: DOWN
- assertVisible: "0 일"
- assertNotVisible: "다시 시도"
- takeScreenshot: 02_home_dashboard
- scrollUntilVisible:
    element: "자유런 시작"
    direction: UP
