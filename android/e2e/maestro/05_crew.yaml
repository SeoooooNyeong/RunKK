# 시나리오 5: 크루 만들기 → 방금 만든 크루 홈 → 크루 탭을 나갔다 다시 들어와도 내 크루 홈. 서버 /crews/me도 확인한다.
appId: ${APP_ID}
name: 05_crew
tags: [smoke]
---
- launchApp
- runFlow: common/home_ready.yaml
- tapOn: "크루"
- extendedWaitUntil:
    visible: "크루 검색 열기|레이스"
    timeout: 15000
# 이미 크루가 있으면(연결 끊김으로 이 단계를 다시 돌 때) 만들기는 건너뛴다.
- runFlow:
    when:
      visible: "크루 검색 열기"
    commands:
      - tapOn: "크루 만들기"
      - extendedWaitUntil:
          visible: "2~12자"
          timeout: 10000
      - tapOn: "2~12자"
      - inputText: ${CREW_NAME}
      - hideKeyboard
      # 크루 태그(평일, 주말 시간대): 첫 "저녁" 칩이 평일 저녁이다.
      - tapOn:
          text: "저녁"
          index: 0
      - tapOn:
          id: "crew_create_submit"
      # 만든 뒤 크루 탭은 내 크루 홈이어야 한다(예전에는 찾기 목록이 그대로 남았다, E2E에서 찾아 고친 결함).
      - extendedWaitUntil:
          visible: "레이스"
          timeout: 15000
- assertVisible: ${CREW_NAME}
- tapOn: "홈"
- extendedWaitUntil:
    visible: "자유런, .*"
    timeout: 10000
- tapOn: "크루"
- extendedWaitUntil:
    visible: "레이스"
    timeout: 15000
- assertVisible: ${CREW_NAME}
- takeScreenshot: 05_crew_home
- runScript:
    file: scripts/server_login.js
    env:
      SERVER_URL: ${SERVER_URL}
      KAKAO_TOKEN: ${KAKAO_TOKEN}
- runScript:
    file: scripts/check_crew.js
    env:
      SERVER_URL: ${SERVER_URL}
      CREW_NAME: ${CREW_NAME}
