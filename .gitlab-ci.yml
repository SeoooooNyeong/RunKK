# 런크크 CI/CD (WBS 1.5-E, Jira S15P31A207-53). 설명은 README.md "CI/CD" 절.
#
# 러너 2개를 같은 EC2에 등록한다.
#   docker : docker executor, /var/run/docker.sock 바인딩 (빌드·테스트, Testcontainers)
#   deploy : shell executor, docker 그룹 사용자 (infra/deploy.sh, 스모크)
# CI 변수 (Settings > CI/CD > Variables, masked + protected):
#   INFRA_ENV                 File 타입, infra/.env 내용 (develop 서버 값)
#   INFRA_ENV_PROD            File 타입, main 배포용 .env
#   FCM_SERVICE_ACCOUNT       File 타입, Firebase 서비스 계정 JSON(배포 때 infra/secrets/fcm-service-account.json으로 복사,
#                             .env에 FCM_CREDENTIALS_FILE=/run/secrets/fcm-service-account.json). 없으면 푸시 없이 로그만
#   GOOGLE_SERVICES_JSON      File 타입, 앱 google-services.json(Android 잡이 android/app/에 복사). 없으면 FCM 없이 빌드
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD  (릴리스 AAB, 시험 APK 서명)
#   KAKAO_NATIVE_APP_KEY, GOOGLE_WEB_CLIENT_ID  앱 로그인 키(prod 패키지 com.a207.runkk용 카카오 네이티브 앱 키)
#   KAKAO_NATIVE_APP_KEY_DEVELOP  develop 패키지(com.a207.runkk.dev)용 카카오 네이티브 앱 키. android:build가 KAKAO_NATIVE_APP_KEY 대신 쓴다

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# 잡은 needs로 자기 스택의 앞 잡만 기다린다(가장 느린 android:lint를 backend·ai가 기다리지 않게). stage는 표시 순서다.
stages: [lint, test, build, deploy, smoke]

# 캐시는 잡마다 따로 둔다. needs로 같은 스택의 잡이 동시에 돌면 한 키를 서로 덮어쓰기 때문이다.
# 새 브랜치는 develop의 같은 잡 캐시로 시작한다(첫 파이프라인이 빈 캐시에서 전부 다시 받고 빌드하지 않게).

variables:
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain"
  # lab.ssafy.com에는 컨테이너 레지스트리가 없어 이미지를 EC2 로컬 Docker에 둔다(두 러너가 같은 데몬을 쓴다)
  ANDROID_CI_IMAGE: runkk-android-sdk:37
  # 캐시(.gradle 수백 MB)를 풀고 묶는 시간을 줄인다
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fastest

.backend-changes: &backend-changes
  - backend/**/*
  - infra/**/*
  - .gitlab-ci.yml

.android-changes: &android-changes
  - android/**/*
  - .gitlab-ci.yml

.ai-changes: &ai-changes
  - ai/**/*
  - infra/docker-compose.yml  # ai 시험이 compose의 ai·api 환경 변수 목록을 확인한다(tests/test_deploy_config.py)
  - .gitlab-ci.yml

# 배포·스모크는 api·ai 어느 쪽이 바뀌어도 돈다. deploy.sh가 두 이미지를 함께 빌드해 올린다
.deploy-changes: &deploy-changes
  - backend/**/*
  - ai/**/*
  - infra/**/*
  - .gitlab-ci.yml

# ---------- ai 서버 ----------

.ai:
  image: python:3.12-slim
  tags: [docker]
  interruptible: true
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_PYTHON_DOWNLOADS: never
  cache:
    key: $CI_JOB_NAME_SLUG-$CI_COMMIT_REF_SLUG
    fallback_keys: [$CI_JOB_NAME_SLUG-develop]
    paths: [.uv-cache]
  before_script:
    - pip install --no-cache-dir uv==0.12.5
    - cd ai && uv sync --frozen
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *ai-changes
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes: *ai-changes

ai:lint:
  extends: .ai
  stage: lint
  script:
    - uv run ruff format --check .
    - uv run ruff check .
    - uv run lint-imports
    - uv run mypy

ai:test:
  extends: .ai
  stage: test
  needs: [ai:lint]
  script:
    - uv run pytest --cov=runkk_ai --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    reports:
      junit: ai/report.xml
      coverage_report:
        coverage_format: cobertura
        path: ai/coverage.xml
    expire_in: 1 week

# 이미지는 EC2에서 바로 만든다. sha 태그를 남겨 롤백에 쓴다. 배포는 infra/deploy.sh가 api와 함께 올린다
# (backend:deploy, ai만 바뀌어도 deploy-changes로 생긴다).
ai:build:
  stage: build
  tags: [deploy]
  needs: [ai:test]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes: *ai-changes
  script:
    - docker build -t runkk-ai:$CI_COMMIT_SHORT_SHA -t runkk-ai:latest ai

# ---------- 백엔드 ----------

.backend:
  image: eclipse-temurin:21-jdk
  tags: [docker]
  interruptible: true
  cache:
    key: $CI_JOB_NAME_SLUG-$CI_COMMIT_REF_SLUG
    fallback_keys: [$CI_JOB_NAME_SLUG-develop]
    paths: [.gradle/caches, .gradle/wrapper]
  before_script:
    - cd backend && chmod +x gradlew
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *backend-changes
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes: *backend-changes

backend:lint:
  extends: .backend
  stage: lint
  script:
    - ./gradlew spotlessCheck

# 단위 테스트 + ArchUnit 패키지 규칙 + Testcontainers(PostgreSQL 17, Redis 8) 통합 테스트.
# 러너가 docker.sock을 바인딩하면 Testcontainers가 컨테이너 안에서 호스트 Docker를 찾는다.
# 컨테이너 포트에 못 붙으면 TESTCONTAINERS_HOST_OVERRIDE에 호스트 docker0 IP(보통 172.17.0.1)를 넣는다.
backend:test:
  extends: .backend
  stage: test
  needs: [backend:lint]
  script:
    - ./gradlew test jacocoTestReport
    - |
      awk -F, 'NR>1 {m+=$4; c+=$5} END {printf "Total coverage: %.1f%%\n", ((m+c)>0 ? c*100/(m+c) : 0)}' build/reports/jacoco/test/jacocoTestReport.csv
  coverage: '/Total coverage: \d+\.\d+%/'
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/TEST-*.xml
    paths: [backend/build/reports]
    expire_in: 1 week

# 이미지는 EC2에서 바로 만든다 (infra/deploy.sh와 같은 Dockerfile). sha 태그를 남겨 롤백에 쓴다.
backend:build:
  stage: build
  tags: [deploy]
  needs: [backend:test]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes: *backend-changes
  script:
    - docker build -t runkk-api:$CI_COMMIT_SHORT_SHA -t runkk-api:latest backend

# develop은 자동, main은 수동 승인. EC2가 한 대라 main 배포는 develop 스택을 교체한다 (README 참고).
# 롤백: docker tag runkk-api:<이전 sha> runkk-api:latest && docker tag runkk-ai:<이전 sha> runkk-ai:latest
#       && cd infra && docker compose up -d --no-build api ai   (바뀐 쪽 이미지만 되돌려도 된다)
backend:deploy:
  stage: deploy
  tags: [deploy]
  # 바뀐 쪽 이미지 빌드만 기다린다(infra만 바뀌면 backend:build만 있다). 안드로이드 잡은 배포를 막지 않는다
  needs:
    - job: backend:build
      optional: true
    - job: ai:build
      optional: true
  environment:
    name: $CI_COMMIT_BRANCH
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *deploy-changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *deploy-changes
      when: manual
      allow_failure: false
  script:
    - if [ "$CI_COMMIT_BRANCH" = "main" ]; then cp "$INFRA_ENV_PROD" infra/.env; else cp "$INFRA_ENV" infra/.env; fi
    - mkdir -p infra/secrets && if [ -n "${FCM_SERVICE_ACCOUNT:-}" ]; then cp "$FCM_SERVICE_ACCOUNT" infra/secrets/fcm-service-account.json && chmod 644 infra/secrets/fcm-service-account.json; fi
    - cd infra && ./deploy.sh
  # shell 러너 작업 폴더에 운영 .env가 남지 않게 잡이 끝나면(실패해도) 지운다
  after_script:
    - rm -f infra/.env

backend:smoke:
  stage: smoke
  tags: [deploy]
  needs: [backend:deploy]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes: *deploy-changes
  script:
    - if [ "$CI_COMMIT_BRANCH" = "main" ]; then cp "$INFRA_ENV_PROD" infra/.env; else cp "$INFRA_ENV" infra/.env; fi
    - PORT=$(grep -E '^NGINX_HTTP_PORT=' infra/.env | cut -d= -f2 | sed 's/[[:space:]]*#.*//' | tr -d ' '); PORT=${PORT:-80}
    - HOST=$(grep -E '^SERVER_NAME=' infra/.env | cut -d= -f2 | sed 's/[[:space:]]*#.*//' | tr -d ' '); HOST=${HOST:-localhost}
    # HTTPS로 바뀐 서버는 80이 https://$host로 301을 준다. 서버 이름으로 부르고 80·443을 이 서버로 고정해 리다이렉트를 따라간다(인증서도 검증)
    - CURL="curl -fsSL --resolve $HOST:$PORT:127.0.0.1 --resolve $HOST:443:127.0.0.1"
    - $CURL "http://$HOST:$PORT/actuator/health" | grep -q '"UP"'
    # ai는 외부 포트가 없어 컨테이너 헬스 상태로 본다("unhealthy"가 걸리지 않게 정확히 비교)
    - test "$(docker compose -f infra/docker-compose.yml --env-file infra/.env ps ai --format '{{.Health}}')" = healthy
    - if [ "$CI_COMMIT_BRANCH" != "main" ]; then $CURL -o /dev/null "http://$HOST:$PORT/docs"; fi
  after_script:
    - rm -f infra/.env

# ---------- 안드로이드 ----------

# SDK 이미지는 ci/android/Dockerfile로 EC2에서 만들어 로컬에 둔다 (android:ci-image 잡). 받아 올 곳이 없으므로
# 로컬 이미지를 그대로 쓴다(docker 러너 config.toml allowed_pull_policies에 if-not-present가 있어야 한다).
.android:
  image:
    name: $ANDROID_CI_IMAGE
    pull_policy: if-not-present
  tags: [docker]
  interruptible: true
  cache:
    key: $CI_JOB_NAME_SLUG-$CI_COMMIT_REF_SLUG
    fallback_keys: [$CI_JOB_NAME_SLUG-develop]
    paths: [.gradle/caches, .gradle/wrapper]
  before_script:
    - if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then cp "$GOOGLE_SERVICES_JSON" android/app/google-services.json; fi
    - cd android && chmod +x gradlew
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *android-changes
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes: *android-changes

android:lint:
  extends: .android
  stage: lint
  # ci/android가 바뀐 파이프라인에서는 새 SDK 이미지가 만들어진 뒤에 돈다
  needs:
    - job: android:ci-image
      optional: true
  script:
    - ./gradlew ktlintCheck lintLocalDebug
  artifacts:
    when: always
    paths: [android/*/build/reports/lint-results-*.html, android/*/*/build/reports/lint-results-*.html]
    expire_in: 1 week

android:test:
  extends: .android
  stage: test
  needs: [android:lint]
  # 단위 시험과 화면 스크린샷 비교(Roborazzi, JVM). 기준 이미지는 android/**/src/test/snapshots에 커밋돼 있고,
  # 화면을 일부러 바꿨을 때만 recordRoborazziLocalDebug로 다시 기록해 커밋한다.
  script:
    - ./gradlew testLocalDebugUnitTest verifyRoborazziLocalDebug
  artifacts:
    when: always
    # 비교가 실패하면 기준·실제·차이 이미지(*_compare.png)가 build/outputs/roborazzi에 남는다. MR에서 내려받아 본다.
    paths:
      - android/**/build/outputs/roborazzi/
    reports:
      junit:
        - android/*/build/test-results/*/TEST-*.xml
        - android/*/*/build/test-results/*/TEST-*.xml
    expire_in: 1 week

# MR 페이지 > 아티팩트에서 APK를 받아 기기에 설치한다 (develop 플레이버 = develop 서버 접속).
android:build:
  extends: .android
  stage: build
  # APK는 시험과 함께 만든다(시험 결과를 기다리지 않는다. 실패한 시험은 MR에서 android:test로 보인다)
  needs: [android:lint]
  # 키스토어 변수가 보이는 파이프라인(protected 변수면 develop·main)에서는 그 키로 서명한다: APK를 덮어 설치할 수 있고
  # 카카오 키 해시가 고정된다. 없으면(MR 파이프라인 등) 잡 컨테이너의 임시 디버그 키로 서명된다.
  script:
    - |
      if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
        export RUNKK_KEYSTORE_PATH=/tmp/release.jks RUNKK_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
          RUNKK_KEY_ALIAS="$ANDROID_KEY_ALIAS" RUNKK_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNKK_KEYSTORE_PATH"
      fi
    # 카카오 네이티브 앱 키는 패키지 하나에만 묶인다. develop APK(com.a207.runkk.dev)는 develop용 키로 만든다
    # (화면 모듈은 플레이버가 없어 빌드 한 번에 키 하나다. 이 잡은 developDebug만 만든다).
    - if [ -n "${KAKAO_NATIVE_APP_KEY_DEVELOP:-}" ]; then export KAKAO_NATIVE_APP_KEY="$KAKAO_NATIVE_APP_KEY_DEVELOP"; fi
    - ./gradlew assembleDevelopDebug
  after_script:
    - rm -f /tmp/release.jks
  artifacts:
    paths: [android/app/build/outputs/apk/develop/debug/*.apk, android/wear/build/outputs/apk/develop/debug/*.apk]
    expire_in: 1 week

# main 병합 시 서명된 AAB. 키스토어 변수가 없으면 잡 자체가 생기지 않는다. Play 콘솔 업로드는 수동.
android:release:
  extends: .android
  stage: build
  needs: [android:test]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $ANDROID_KEYSTORE_BASE64
      changes: *android-changes
  variables:
    RUNKK_KEYSTORE_PATH: /tmp/release.jks
    RUNKK_KEYSTORE_PASSWORD: $ANDROID_KEYSTORE_PASSWORD
    RUNKK_KEY_ALIAS: $ANDROID_KEY_ALIAS
    RUNKK_KEY_PASSWORD: $ANDROID_KEY_PASSWORD
  script:
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNKK_KEYSTORE_PATH"
    - ./gradlew bundleProdRelease
  artifacts:
    paths: [android/app/build/outputs/bundle/prodRelease/*.aab]
    expire_in: 1 month

# ci/android/Dockerfile이 바뀌면 같은 파이프라인의 안드로이드 잡보다 먼저(.pre) EC2 로컬 이미지를 다시 만든다.
# 레이어 캐시가 있어 바뀐 단계만 다시 받는다. 이미지가 없는 새 서버에서는 이 명령을 한 번 직접 실행한다(infra/README.md).
android:ci-image:
  stage: .pre
  tags: [deploy]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [ci/android/**/*]
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes: [ci/android/**/*]
  script:
    - docker build -t "$ANDROID_CI_IMAGE" ci/android
