# RunKK server stack: nginx -> api (Spring Boot) -> mysql / redis
# Usage (on the EC2 or locally):  cp .env.example .env  &&  ./deploy.sh
name: runkk

services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../backend
    image: runkk-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mysql
      REDIS_HOST: redis
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ai 서버(FastAPI). 외부 포트 없이 api만 내부 망으로 부른다(D-23). 셀카는 메모리에서만 다루므로 루트는 읽기 전용, /tmp만 tmpfs.
  # api는 depends_on으로 묶지 않는다: ai가 내려가도 api는 규칙 문구로 대체한다(D-58).
  ai:
    build:
      context: ../ai
    image: runkk-ai:latest
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # Runs only when you ask for it:  docker compose run --rm certbot certonly ...
  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  mysql-data:
  redis-data:
  certbot-www:
  letsencrypt:
