# 런크크 환경 스택(한 환경 = 한 compose 프로젝트): api(Spring Boot) -> postgres / redis, api -> ai(FastAPI), backup(매일 pg_dump).
# 같은 EC2에 prod(main 브랜치, 프로젝트 runkk-prod)와 develop(develop 브랜치, 프로젝트 runkk-develop)이 이 파일로 따로 뜬다.
# DB·Redis·api·ai·백업이 환경마다 따로라 자료가 섞이지 않는다. postgres·redis·ai는 프로젝트 전용 망에만 있고,
# api만 에지 스택(docker-compose.edge.yml, 프로젝트 runkk)의 망 runkk_default에 api-<환경> 별칭으로 붙어 nginx·Prometheus가 부른다.
# 컨테이너마다 필요한 값만 넘긴다(env_file 없음): ai는 RUNKK_*만, api는 LLM·GMS 키를 받지 않는다. avatar(Node)는 프로필로 켠다.
# 사용: cp .env.example .env (RUNKK_ENV 등 채우기) && cp edge.env.example edge.env && ./deploy.sh   (README 3절)
name: runkk-${RUNKK_ENV:?set RUNKK_ENV (develop|prod) in .env}

# 모든 컨테이너 로그를 크기로 돌린다(NFR-020). 컨테이너를 다시 만들면 이 로그는 사라지므로 14일 넘게 둘 기록은 api 파일 로그(api-logs 볼륨)에 남긴다
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  api:
    # deploy.sh가 ../backend로 환경별 태그(runkk-api:develop|prod)를 만든다. 두 환경이 서로의 이미지를 덮어쓰지 않는다
    image: runkk-api:${RUNKK_ENV}
    restart: unless-stopped
    logging: *default-logging
    networks:
      default: {}
      edge:
        # nginx(443 → api-prod, 8443 → api-develop)와 Prometheus가 이 이름으로 부른다. 서비스 이름 api는 두 환경이 겹치므로 쓰지 않는다
        aliases:
          - api-${RUNKK_ENV}
    # backend/src/main/resources/application.yml이 읽는 값 + ai 연결(AI_SERVER_URL, RUNKK_INTERNAL_TOKEN)만 넘긴다
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # 컨테이너 메모리 제한(mem_limit) 안에서 힙을 잡는다. 나머지는 메타스페이스·스레드 스택·직접 버퍼 몫이다.
      # 메모리가 바닥나면 반쯤 살아 있는 상태로 남지 않고 끝나서 restart 정책으로 다시 뜬다
      JAVA_TOOL_OPTIONS: ${API_JAVA_OPTS:--XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError}
      DB_HOST: postgres
      # postgres·redis는 내부 망에서 기본 포트로 고정한다(밖으로 열지 않으므로 바꿀 이유가 없다)
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Hikari 최대 풀. 커밋 뒤 REQUIRES_NEW 수신자가 연결을 하나 더 쓰므로 10이면 크루런 동시 업로드에서 고갈된다(T-4). PostgreSQL max_connections(기본 100) 안에서
      DB_POOL_SIZE: ${DB_POOL_SIZE:-50}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # redis 접속 비밀번호(redis 서비스 --requirepass와 같은 값). 내부 망 안에서도 다른 컨테이너의 무단 접근을 막는다
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # 매칭 대기열·대결 세션 저장소 redis|jdbc(D-07, Redis 장기 장애 때 jdbc), 실시간 방식 websocket|polling(D-57)
      RUNKK_QUEUE: ${RUNKK_QUEUE:-redis}
      RUNKK_LIVE: ${RUNKK_LIVE:-websocket}
      # 셀카 변환 서버 스위치(application.yml runkk.features.selfie-enabled). false면 관리툴 운영 기준값과 관계없이 셀카 변환을 막는다.
      # 기본은 꺼짐이다. 베타(prod)는 꺼 두고(2026-10-23 결정), 셀카를 시험하는 develop만 .env에 SELFIE_ENABLED=true를 둔다
      SELFIE_ENABLED: ${SELFIE_ENABLED:-false}
      AI_SERVER_URL: http://ai:8000
      # actuator 관리 포트(develop·prod 프로필). 밖으로 열지 않는다. healthcheck·nginx /actuator/health·Prometheus만 부른다
      MANAGEMENT_PORT: "8081"
      RUNKK_INTERNAL_TOKEN: ${RUNKK_INTERNAL_TOKEN:?set RUNKK_INTERNAL_TOKEN in .env}
      # 회원 JWT 서명 키. 비우면 api가 기동마다 임의 키를 만들어 재시작 때 모든 토큰이 무효가 되므로 배포에서는 필수
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # 관리툴 운영자 토큰 서명 키(D-42). JWT_SECRET과 달라야 하며(같으면 api가 기동을 멈춘다) 비우면 재시작 때마다 관리툴 재로그인
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?set ADMIN_JWT_SECRET in .env}
      # 첫 운영자 시드: 화이트리스트가 비었을 때만 한 번 넣고 감사 기록을 남긴다. 예) KAKAO:1234567890
      RUNKK_BOOTSTRAP_OPERATORS: ${RUNKK_BOOTSTRAP_OPERATORS:-}
      SCHEDULER_POOL_SIZE: ${SCHEDULER_POOL_SIZE:-20}
      # 랜드마크 배경 알림 없이 채우기 기준 시각(D-176): 이 시각 전 유효 거리만 센다. 첫 배포 때 V25 적용 시각으로 둔다
      AVATAR_BACKFILL_CUTOFF: ${AVATAR_BACKFILL_CUTOFF:-2026-10-22T00:00:00}
      # 카카오·구글·Apple 로그인 같은 인증 요청의 클라이언트(IP)별 분당 상한
      AUTH_CLIENT_REQUESTS_PER_MINUTE: ${AUTH_CLIENT_REQUESTS_PER_MINUTE:-30}
      # 법정 고지 문서 주소. Spring은 빈 환경 변수도 값으로 보아 application.yml 기본값을 덮으므로 기본값을 서버 설정과 같게 둔다
      LEGAL_TERMS_URL: ${LEGAL_TERMS_URL:-https://k15a207.p.ssafy.io/legal/terms}
      LEGAL_PRIVACY_POLICY_URL: ${LEGAL_PRIVACY_POLICY_URL:-https://k15a207.p.ssafy.io/legal/privacy}
      LEGAL_LOCATION_TERMS_URL: ${LEGAL_LOCATION_TERMS_URL:-https://k15a207.p.ssafy.io/legal/location}
      LEGAL_HELP_URL: ${LEGAL_HELP_URL:-https://k15a207.p.ssafy.io/legal/help}
      # 외부 연동. 비우면 그 연동만 꺼진다(카카오·구글 로그인 거부, 푸시는 로그만, 날씨 없이 저장)
      KAKAO_APP_ID: ${KAKAO_APP_ID:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:-}
      # 파일 로그(NFR-020 요청 오류·장애 기록 14일 이상, 처리방침 "접속·요청 오류·장애 기록 30일"). 날마다 새 파일로 돌리고 30일 지난 파일을 지운다.
      # api-logs 볼륨이라 배포로 컨테이너를 다시 만들어도 남는다. 콘솔 로그(docker logs)는 그대로 나간다
      LOGGING_FILE_NAME: /var/log/runkk/api.log
      LOGGING_LOGBACK_ROLLINGPOLICY_FILE_NAME_PATTERN: /var/log/runkk/api.%d{yyyy-MM-dd}.%i.log.gz
      LOGGING_LOGBACK_ROLLINGPOLICY_MAX_HISTORY: "30"
      LOGGING_LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE: 50MB
      LOGGING_LOGBACK_ROLLINGPOLICY_TOTAL_SIZE_CAP: 2GB
    # FCM 서비스 계정 JSON은 infra/secrets/에 두고(커밋 금지) FCM_CREDENTIALS_FILE=/run/secrets/<파일명>으로 가리킨다
    volumes:
      - ./secrets:/run/secrets:ro
      - api-logs:/var/log/runkk
    # 셀카 multipart 임시 파일이 디스크에 남지 않게 /tmp를 메모리에 둔다(5.4, D-59)
    tmpfs:
      - /tmp:size=64m,mode=1777
    # 두 환경이 15GiB·4코어 EC2 하나에 함께 올라간다(분리 전 측정 사용량 1.9GiB). 힙은 JAVA_TOOL_OPTIONS로 이 값의 60%(약 0.9GiB)
    mem_limit: ${API_MEM_LIMIT:-1536m}
    expose:
      - "8080"
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # 비밀번호를 명령줄에 풀어 쓰지 않고 컨테이너 안에서 환경 변수로 읽는다(공백·특수문자가 있어도 안전)
    command: ["sh", "-c", 'exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  # ai 서버(FastAPI). 외부 포트 없이 api만 내부 망으로 부른다(D-23). 셀카는 메모리에서만 다루므로 루트는 읽기 전용, /tmp만 tmpfs.
  # api는 depends_on으로 묶지 않는다: ai가 내려가도 api는 규칙 문구로 대체한다(D-58).
  ai:
    image: runkk-ai:${RUNKK_ENV}
    restart: unless-stopped
    logging: *default-logging
    # ai Settings가 읽는 RUNKK_*만 넘긴다(M1). 빈 값은 ai가 기본값으로 본다(env_ignore_empty)
    environment:
      RUNKK_INTERNAL_TOKEN: ${RUNKK_INTERNAL_TOKEN:?set RUNKK_INTERNAL_TOKEN in .env}
      RUNKK_LLM_PROVIDER: ${RUNKK_LLM_PROVIDER:-}
      RUNKK_LLM_MODEL: ${RUNKK_LLM_MODEL:-}
      RUNKK_LLM_TIMEOUT_S: ${RUNKK_LLM_TIMEOUT_S:-}
      RUNKK_LLM_MAX_TOKENS: ${RUNKK_LLM_MAX_TOKENS:-}
      RUNKK_LLM_DAILY_HARD_CAP: ${RUNKK_LLM_DAILY_HARD_CAP:-}
      RUNKK_ANTHROPIC_API_KEY: ${RUNKK_ANTHROPIC_API_KEY:-}
      # Anthropic SDK가 직접 읽는 주소(SSAFY GMS 같은 호환 프록시). 빈 문자열이면 SDK가 그대로 써서 깨지므로 기본값을 둔다
      ANTHROPIC_BASE_URL: ${RUNKK_ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      RUNKK_OPENAI_API_KEY: ${RUNKK_OPENAI_API_KEY:-}
      # 아바타(Node) 서버 기준 경로. avatar 서비스를 켠 환경에서 http://avatar:3000/api/v1. 비우면 /faces가 503(기본 캐릭터)
      RUNKK_FACE_TIMEOUT_S: ${RUNKK_FACE_TIMEOUT_S:-}
      RUNKK_FACE_API_URL: ${RUNKK_FACE_API_URL:-}
      RUNKK_MAX_IMAGE_BYTES: ${RUNKK_MAX_IMAGE_BYTES:-}
      RUNKK_MAX_IMAGE_PIXELS: ${RUNKK_MAX_IMAGE_PIXELS:-}
      RUNKK_EXPOSE_DOCS: ${RUNKK_EXPOSE_DOCS:-}
      # AI 코치(F5). 키는 RUNKK_ANTHROPIC_API_KEY를 같이 쓴다. 하루 상한으로 크레딧을 지킨다
      RUNKK_COACH_MODEL: ${RUNKK_COACH_MODEL:-}
      RUNKK_COACH_MAX_TOKENS: ${RUNKK_COACH_MAX_TOKENS:-}
      RUNKK_COACH_TIMEOUT_S: ${RUNKK_COACH_TIMEOUT_S:-}
      RUNKK_COACH_DAILY_HARD_CAP: ${RUNKK_COACH_DAILY_HARD_CAP:-}
      RUNKK_COACH_USER_DAILY_CAP: ${RUNKK_COACH_USER_DAILY_CAP:-}
      # 분석 결과 저장(analytics 스키마, runkk_ai 계정). 비우면 메모리 저장소(재시작하면 비움)
      RUNKK_DB_URL: ${RUNKK_DB_URL:-}
      # writer(자체 소형 모델). writer 서비스를 켠 환경에서 http://writer:8080. 비우면 템플릿 문장 그대로
      RUNKK_WRITER_URL: ${RUNKK_WRITER_URL:-}
      RUNKK_WRITER_TIMEOUT_S: ${RUNKK_WRITER_TIMEOUT_S:-}
      RUNKK_WRITER_TEMPERATURE: ${RUNKK_WRITER_TEMPERATURE:-}
      RUNKK_WRITER_MODEL_VERSION: ${RUNKK_WRITER_MODEL_VERSION:-}
    # DB를 쓰면 기동 때 마이그레이션을 돌리므로 postgres가 준비된 뒤 뜬다(api와는 묶지 않는다)
    depends_on:
      postgres:
        condition: service_healthy
    # avatar는 전용 망 avatar에만 있고 ai만 그 망에 같이 붙는다(Node 명세 1장: ai와 avatar만 붙는 전용 bridge)
    networks:
      default: {}
      avatar: {}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m  # 같은 EC2의 postgres·redis·api를 지킨다. 외부 API 중계라 여유가 크다
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # writer(runkk-writer, S15P31A207-196). QLoRA로 학습한 Qwen3-4B(GGUF Q4_K_M, 약 2.5GB)를 llama.cpp로 CPU에서 돌린다.
  # 프로필 writer라 .env에 COMPOSE_PROFILES=writer를 넣은 환경에서만 뜬다(모델 파일을 올린 서버만, 메모리 약 3GB).
  # 모델 파일은 WRITER_MODEL_DIR(기본 /srv/runkk/models)에 둔다. ai만 내부 망으로 부르고 밖으로 열지 않는다.
  # ai는 writer 없이도 뜬다(RUNKK_WRITER_URL을 비우거나 writer가 죽으면 템플릿 문장). 이미지는 측정에 쓴 버전으로 고정
  writer:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:8ee4ec7ce58a921313d07390c6699af13aa5ec083f3cdf67e5f4155767047373
    profiles: ["writer"]
    restart: unless-stopped
    logging: *default-logging
    # -np 1: 한 번에 한 건(ai도 한 건씩 보낸다). -c 2048: 지시문+요약+출력이 1,500토큰 안팎
    command:
      - "-m"
      - "/models/${WRITER_MODEL_FILE:-runkk-writer-v1-qwen3-4b-q4_k_m.gguf}"
      - "-c"
      - "2048"
      - "-np"
      - "1"
      - "-t"
      - "${WRITER_THREADS:-4}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    volumes:
      - ${WRITER_MODEL_DIR:-/srv/runkk/models}:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 3500m
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 60s

  # 아바타 서버(안선영 님 Node, S15P31A207-164). 셀카 → 특징 분석(gpt-4.1-mini) → 머리 1장 생성(gpt-image-2.5) → 코드 마스크로
  # face·eyes·hair 3레이어로 나눠 저장한다. 프로필 avatar라 .env에 COMPOSE_PROFILES에 avatar를 넣은 환경에서만 뜬다.
  # ai만 전용 망 avatar로 부르고(기준 경로 http://avatar:3000/api/v1) 밖으로 열지 않는다. GMS 호출이 필요해 internal 망은 아니다.
  # 결과는 named volume(/app/data, 사용자별 폴더)에 남는다. deploy.sh가 ../avatar(Dockerfile)로 환경별 태그를 만든다.
  avatar:
    image: runkk-avatar:${RUNKK_ENV}
    profiles: ["avatar"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      # OpenAI 호환 GMS 주소와 키. 키는 .env로만 넘긴다(채팅·커밋 금지)
      GMS_BASE_URL: ${AVATAR_GMS_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      GMS_KEY: ${AVATAR_GMS_KEY:-}
    networks:
      avatar: {}
    volumes:
      - avatar-data:/app/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m  # 1024×1024 PNG를 메모리에서 자른다
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  # 매일 백업(NFR-018·019·037, 처리방침 "하루 1회 이상 백업, 백업본 7일 보존"). BACKUP_TIME(기본 04:30, 3시 파기 배치 뒤)에 pg_dump -Fc를 떠서
  # 호스트 폴더 BACKUP_DIR/<환경>(기본 /var/backups/runkk/<환경>)에 두고 7일 지난 덤프를 지운다. 덤프는 BACKUP_OWNER(기본 ubuntu 1000:1000) 소유 0600.
  # deploy.sh는 배포 직전에도 한 번 뜬다(Flyway 마이그레이션 전). 지금 바로 뜨려면: docker exec runkk-<환경>-backup-1 sh /opt/runkk-backup/pg-backup.sh now
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["sh", "/opt/runkk-backup/pg-backup.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:?set DB_NAME in .env}
      PGUSER: ${DB_USER:?set DB_USER in .env}
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Asia/Seoul
      BACKUP_PREFIX: runkk-${RUNKK_ENV}
      BACKUP_TIME: ${BACKUP_TIME:-04:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_OWNER: ${BACKUP_OWNER:-1000:1000}
    volumes:
      - ./backup:/opt/runkk-backup:ro
      - ${BACKUP_DIR:-/var/backups/runkk}/${RUNKK_ENV}:/backups
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default: {}
  # ai ↔ avatar 전용 망. 프로젝트 안에서 만들며 두 서비스만 붙는다
  avatar: {}
  # 에지 스택(docker-compose.edge.yml)이 만드는 망. deploy.sh가 에지를 먼저 올린다
  edge:
    name: ${EDGE_NETWORK:-runkk_default}
    external: true

volumes:
  # 볼륨 이름은 .env에서 정한다(필수). develop은 분리 전 볼륨(runkk_postgres-data·runkk_redis-data)을 그대로 이어 쓰고,
  # prod는 새 볼륨(runkk-prod_postgres-data·runkk-prod_redis-data)을 쓴다. 빠지면 compose가 멈춰 엉뚱한 빈 DB로 뜨지 않는다
  postgres-data:
    name: ${POSTGRES_VOLUME:?set POSTGRES_VOLUME in .env (develop은 runkk_postgres-data)}
  redis-data:
    name: ${REDIS_VOLUME:?set REDIS_VOLUME in .env (develop은 runkk_redis-data)}
  # 아바타 결과(사용자별 머리·작업 기록). 환경마다 따로다
  avatar-data: {}
  api-logs:
