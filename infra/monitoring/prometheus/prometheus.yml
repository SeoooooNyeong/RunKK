# 런크크 모니터링(S15P31A207-78). compose 내부 망에서만 읽는다(호스트 포트 없음). 보존 기간·크기는 docker-compose.yml command에 둔다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot actuator. develop·prod는 관리 포트 8081에만 있다(서비스 포트 8080·nginx로는 닿지 않는다)
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]

  # EC2 호스트 CPU·메모리·디스크. 컨테이너 망 안에서 돌아 네트워크 지표는 node-exporter 컨테이너 것이다
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
