<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>1km 걷거나 달리기 | 런크크</title>
<meta name="description" content="1km 한 번이면 자동 응모, 메가커피 쿠폰 10명 추첨">
<meta property="og:title" content="1km 걷거나 달리기">
<meta property="og:description" content="메가커피 쿠폰 10명 추첨">

<script>
(function () {
  var root = document.documentElement;
  var t = new URLSearchParams(location.search).get('theme');
  if (t === 'dark' || t === 'light') { root.setAttribute('data-theme', t); return; }
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function apply() { root.setAttribute('data-theme', mq && mq.matches ? 'dark' : 'light'); }
  apply();
  if (mq && mq.addEventListener) mq.addEventListener('change', apply);
})();
</script>
<link rel="preload" as="image" href="hero.webp">
<style>
:root{
  --violet:#5C4BDB;--on-violet:#FFFFFF;--lime:#CAEB2E;--on-lime:#171B12;
  --bg:#F7F8F2;--surface:#FFFFFF;--surface-high:#E9EDE0;--container:#E3DFF9;
  --text:#171B12;--text2:#67705B;--divider:#E9EDE0;--accent-text:#5C4BDB;
  --shadow:0 8px 12px rgba(26,20,64,.10);--bar-shadow:0 -4px 8px rgba(0,0,0,.08);
  --map-bg:#E8EBDF;--map-road:#FFFFFF;--map-label:#6B7360;--map-halo:#E8EBDF;--map-mc:rgba(92,75,219,.28);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#171B12;--surface:#292F25;--surface-high:#343D2D;--container:#302856;
  --text:#FFFFFF;--text2:#A8AEA0;--divider:#444B3E;--accent-text:#A99FF5;
  --shadow:0 8px 16px rgba(0,0,0,.28);--bar-shadow:0 -4px 10px rgba(0,0,0,.35);
  --map-bg:#1F241A;--map-road:#3A4233;--map-label:#A8AEA0;--map-halo:#1F241A;--map-mc:rgba(169,159,245,.30);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.35;word-break:keep-all;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}

/* 히어로 */
.hero{position:relative;height:430px;background:var(--lime);overflow:hidden;color:var(--on-lime)}
.ring{position:absolute;left:calc(50% - 15px);top:10px;width:340px;height:340px;border:30px solid var(--violet);border-radius:50%}
.speed{position:absolute;height:10px;border-radius:5px;background:var(--on-lime);opacity:.12}
.girl{position:absolute;left:calc(50% + 37px);top:150px;width:136px;height:250px;user-select:none;-webkit-user-drag:none}
.bar{position:absolute;left:0;right:0;top:0;height:48px;padding:14px 12px 0;display:flex;justify-content:space-between;align-items:center;z-index:2}
.icon-btn{width:40px;height:40px;margin-top:-8px;display:grid;place-items:center;border-radius:50%}
.icon-btn svg{width:24px;height:24px}
.copy{position:absolute;left:20px;top:74px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;z-index:1}
.pill{display:inline-block;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.pill.ink{background:var(--on-lime);color:#fff}
.pill.white{background:#fff;color:#5C4BDB}
.hero h1{font-size:40px;line-height:1.14;font-weight:700;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:#5C4BDB}

/* 본문 */
main{position:relative;margin-top:-40px;padding:0 16px calc(128px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:32px;max-width:520px;margin-left:auto;margin-right:auto}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow)}
.flat{box-shadow:none}
.timer{padding:18px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.timer .label{font-size:13px;font-weight:600;color:var(--text2)}
.cells{display:flex;align-items:center;gap:8px}
.cell{display:flex;align-items:flex-end;gap:4px;background:var(--surface-high);border-radius:14px;padding:8px 12px}
.cell b{font-size:30px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.cell span{font-size:14px;font-weight:600;color:var(--text2)}
.colon{font-size:24px;font-weight:700;color:var(--text2)}
.ended{font-size:30px;line-height:1.1;font-weight:700;padding:8px 0}

.sec{display:flex;flex-direction:column;gap:14px}
.sec h2{font-size:20px;font-weight:700}

.me{padding:22px;display:flex;align-items:center;gap:20px}
.me-ring{position:relative;flex:none;width:104px;height:104px}
.me-ring>svg{display:block;width:104px;height:104px;transform:rotate(-90deg)}
.me-ring .track{stroke:var(--surface-high)}
.me-ring .prog{stroke:var(--violet);transition:stroke-dashoffset .6s ease}
.me-center{position:absolute;inset:0;display:grid;place-items:center}
.me-center .check{width:44px;height:44px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center}
.me-center .check svg{width:24px;height:24px}
.me-center .frac{display:flex;align-items:flex-end;gap:2px;font-weight:700}
.me-center .frac b{font-size:34px;line-height:1}
.me-center .frac span{font-size:16px;color:var(--text2)}
.me-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.me-text .title{font-size:20px;font-weight:700}
.me-text .meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--surface-high);color:var(--text2)}
.chip.v{background:var(--container);color:var(--accent-text)}

.prize{padding:20px;display:flex;align-items:center;gap:18px}
.prize-ico{flex:none;width:72px;height:72px;border-radius:22px;background:var(--lime);color:var(--on-lime);display:grid;place-items:center}
.prize-ico svg{width:36px;height:36px}
.prize .title{font-size:18px;font-weight:700;margin-bottom:6px}

.steps{display:flex;padding:20px 8px;margin:0;list-style:none}
.step{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px;text-align:center}
.step-ico{position:relative;width:60px;height:60px;border-radius:50%;background:var(--container);color:var(--accent-text);display:grid;place-items:center}
.step-ico.lime{background:var(--lime);color:var(--on-lime)}
.step-ico svg{width:26px;height:26px}
.step-no{position:absolute;left:40px;top:-2px;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--text);color:var(--surface);font-size:11px;font-weight:700;line-height:1.35}
.step p{font-size:14px;font-weight:600}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:16px;background:var(--surface-high)}
.tab{height:40px;border-radius:12px;font-size:14px;font-weight:600;color:var(--text2);white-space:nowrap}
.tab[aria-selected=true]{background:var(--surface);color:var(--text);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab b{color:var(--accent-text);margin-right:3px}
.course{overflow:hidden}
.map{display:block;width:100%;height:auto;aspect-ratio:3/2}
.course-info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.course-info h3{font-size:18px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-high);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;font-weight:600;color:var(--text2)}
.stat b{font-size:17px;font-weight:700;white-space:nowrap}
.osm{font-size:12px;color:var(--text2)}

/* 지도 */
.mbg{fill:var(--map-bg)}
.rr,.rs,.rp{fill:none;stroke:var(--map-road);stroke-linecap:round;stroke-linejoin:round}
.rr{stroke-width:3.5}
.rs{stroke-width:6}
.rp{stroke-width:11}
.mc{fill:var(--map-mc);stroke:var(--violet);stroke-width:1.5}
.lb,.lbs{font-size:13px;font-weight:500;fill:var(--map-label);paint-order:stroke;stroke:var(--map-halo);stroke-width:3.5px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:middle}
.lbs{font-weight:700;fill:var(--text);text-anchor:start;dominant-baseline:auto}
.stn{fill:#00A84D;stroke:var(--map-bg);stroke-width:1.5}
.stt{font-size:9px;font-weight:700;fill:#fff;text-anchor:middle}
.rc{fill:none;stroke:var(--surface);stroke-width:9.5;stroke-linecap:round;stroke-linejoin:round}
.rt{fill:none;stroke:var(--violet);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.ar{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.st{fill:var(--lime);stroke:#171B12;stroke-width:2.5}
.turn{fill:var(--surface);stroke:var(--violet);stroke-width:3}
.lbst,.lbt,.lbd,.lbm{font-weight:700;paint-order:stroke;stroke:var(--map-halo);stroke-width:3.5px;stroke-linejoin:round}
.lbst{font-size:15px;fill:var(--text)}
.lbt{font-size:13px;fill:var(--accent-text)}
.lbd{font-size:13px;fill:var(--text)}
.lbm{font-size:12px;fill:var(--accent-text)}

/* 하단 고정 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);box-shadow:var(--bar-shadow);padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
.dock-in{width:100%;max-width:488px;margin:0 auto}
.cta{width:100%;height:56px;border-radius:999px;background:var(--violet);color:var(--on-violet);font-size:17px;font-weight:700}
.cta:disabled{opacity:.45;cursor:default}
@media (max-width:370px){
  .hero h1{font-size:36px}
  .cell{padding:8px 10px}
  .tab{font-size:13px}
}
</style>
</head>
<body>
<header class="hero">
  <div class="ring" aria-hidden="true"></div>
  <div class="speed" style="left:-20px;top:300px;width:160px" aria-hidden="true"></div>
  <div class="speed" style="left:-14px;top:322px;width:130px" aria-hidden="true"></div>
  <div class="speed" style="left:-8px;top:344px;width:100px" aria-hidden="true"></div>
  <div class="speed" style="left:-2px;top:366px;width:70px" aria-hidden="true"></div>
  <img class="girl" src="hero.webp" width="136" height="250" alt="">
  <nav class="bar">
    <button class="icon-btn" id="back" type="button" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18L9 12L15 6"/></svg></button>
    <button class="icon-btn" id="share" type="button" aria-label="공유"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12V19C4 19.55 4.45 20 5 20H19C19.55 20 20 19.55 20 19V12M8 6L12 2L16 6M12 2V15"/></svg></button>

</header>

<main>
  <section class="card timer" aria-live="polite">
    <p class="label" id="timer-label">끝나기까지</p>

      <div class="cell"><b id="t-m">00</b><span>분</span></div>
    </div>
    <p class="ended hidden" id="ended">종료</p>

  <section class="sec hidden" id="me-sec">
    <h2>내 응모</h2>

          <span class="check hidden" id="me-check"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.8 14.6L11 19.8L22.2 8.8"/></svg></span>
          <span class="frac" id="me-frac"><b>0</b><span>/ 1</span></span>

        <p class="title" id="me-title">아직이에요</p>
        <div class="meta" id="me-meta"></div>
      </div>

  </section>

  <section class="sec">
    <h2>경품</h2>

      <div class="prize-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2V4"/><path d="M14 2V4"/><path d="M6 2V4"/><path d="M16 8A1 1 0 0 1 17 9V17A4 4 0 0 1 13 21H7A4 4 0 0 1 3 17V9A1 1 0 0 1 4 8H18A4 4 0 1 1 18 16H17"/></svg></div>

        <p class="title">메가커피 쿠폰</p>

  <section class="sec">

  </section>

  <section class="sec">
    <h2>산책 코스 추천</h2>

  <div class="dock-in">
    <button class="cta" id="cta" type="button" disabled>달리러 가기</button>
  </div>
</div>

<script>
(function () {
  var SLUG = 'beta-1km';
  var START = Date.parse('2026-11-08T00:00:00+09:00');
  var END = Date.parse('2026-11-17T00:00:00+09:00');
  var SHARE_TEXT = '런크크 이벤트 1km 걷거나 달리기\n' + location.origin + location.pathname;
  var RING = 276.5;

  function $(id) { return document.getElementById(id); }
  function app() { var a = window.RunkkApp; return a && typeof a === 'object' ? a : null; }
  function now() {
    var q = new URLSearchParams(location.search).get('now');
    var t = q ? Date.parse(q) : NaN;
    return isNaN(t) ? Date.now() : t;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function md(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
    return m ? (+m[2]) + '월 ' + (+m[3]) + '일' : '';
  }
  function km(m) { return (Math.floor(m / 10) / 100).toFixed(2) + 'km'; }

  // 남은 시간
  var last = '';
  function tick() {
    var t = now();
    var ended = t >= END;
    var target = t < START ? START : END;
    $('timer-label').textContent = t < START ? '시작까지' : '끝나기까지';
    $('timer-label').classList.toggle('hidden', ended);
    $('cells').classList.toggle('hidden', ended);
    $('ended').classList.toggle('hidden', !ended);
    if (ended) { $('cta').disabled = true; return; }
    var left = Math.max(0, Math.ceil((target - t) / 60000));
    var d = Math.floor(left / 1440), h = Math.floor(left % 1440 / 60), m = left % 60;
    var key = d + ':' + h + ':' + m;
    if (key === last) return;
    last = key;
    $('t-d').textContent = pad(d);
    $('t-h').textContent = pad(h);
    $('t-m').textContent = pad(m);
  }

  // 앱 버튼
  function wire() {
    var a = app();
    $('cta').disabled = !a || now() >= END;
    $('back').classList.toggle('hidden', !a);
    $('share').classList.toggle('hidden', !a && !navigator.share);
  }
  $('cta').addEventListener('click', function () { var a = app(); if (a) a.open('run'); });
  $('back').addEventListener('click', function () { var a = app(); if (a) a.close(); });
  $('share').addEventListener('click', function () {
    var a = app();
    if (a) { a.share(SHARE_TEXT); return; }
    if (navigator.share) navigator.share({ title: '1km 걷거나 달리기', url: location.origin + location.pathname }).catch(function () {});
  });

  // 코스 탭
  var tabs = Array.prototype.slice.call(document.querySelectorAll('[role=tab]'));
  function select(tab, focus) {
    tabs.forEach(function (t) {
      var on = t === tab;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      $(t.getAttribute('aria-controls')).classList.toggle('hidden', !on);
    });
    if (focus) tab.focus();
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { select(t); });
    t.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') select(tabs[(i + 1) % tabs.length], true);
      if (e.key === 'ArrowLeft') select(tabs[(i + tabs.length - 1) % tabs.length], true);
    });
  });
  var initTab = $('tab-' + location.hash.slice(1));
  if (initTab) select(initTab);

  // 내 응모
  function renderMe(data) {
    var it = (data && data.items && data.items[0]) || null;
    if (!it) { hideMe(); return; }
    var done = !!it.done;
    $('me-prog').setAttribute('stroke-dashoffset', done ? '0' : String(RING));
    $('me-check').classList.toggle('hidden', !done);
    $('me-frac').classList.toggle('hidden', done);
    $('me-title').textContent = done ? '응모 완료' : '아직이에요';
    var meta = $('me-meta');
    meta.textContent = '';
    var vals = done ? [md(it.doneAt), it.distanceMeters ? km(it.distanceMeters) : ''] : ['1km 남았어요'];
    vals.forEach(function (v, i) {
      if (!v) return;
      var c = document.createElement('span');
      c.className = 'chip' + (done && i === 1 ? ' v' : '');
      c.textContent = v;
      meta.appendChild(c);
    });
    $('me-sec').classList.remove('hidden');
  }
  function hideMe() { $('me-sec').classList.add('hidden'); }
  function loadMe() {
    var a = app();
    var token = '';
    try { token = a ? a.getAccessToken() : ''; } catch (e) { token = ''; }
    if (!token) { hideMe(); return; }
    fetch('/api/v1/events/' + SLUG + '/me', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(renderMe)
      .catch(hideMe);
  }

  function refresh() { wire(); tick(); loadMe(); }
  refresh();
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) refresh(); });
})();
</script>
