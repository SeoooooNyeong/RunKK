# 모니터링 대시보드(S15P31A207-78). prod server 블록(443, HTTP 모드는 80)만 include한다. Grafana 로그인(관리자 계정)으로만 들어간다.
# Grafana가 serve_from_sub_path로 /grafana/ 경로를 직접 받으므로 경로를 그대로 넘긴다(proxy_pass에 URI를 붙이지 않는다).
# 변수로 두어 grafana 컨테이너가 없어도 nginx는 뜨고 /grafana/만 502가 난다. $grafana_connection은 default.conf의 map이다.

location = /grafana {
    # 상대 주소로 돌려보내 로컬처럼 기본 포트가 아닌 포트로 열어도 같은 포트에 머문다
    absolute_redirect off;
    return 301 /grafana/;
}

location ^~ /grafana/ {
    set $grafana_upstream grafana:3000;
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $grafana_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
