# 런크크 api 공통 경로. prod(443)·develop(8443) server 블록이 include한다(http·https 두 모드 공통).
# include하는 server가 $api_upstream·$api_management_upstream을 먼저 정한다. 변수로 proxy_pass를 쓰므로 nginx가 요청 때 이름을 풀어
# resolver(default.conf)를 따르고, 그 환경 api가 내려가 있어도 nginx는 뜨며 그 포트만 502가 난다(URI를 붙이지 않아 원래 경로가 그대로 넘어간다).
# 이 폴더는 envsubst를 거치지 않는다. ${...} 대신 nginx 변수만 쓴다.

client_max_body_size 10m;

# 접근 로그는 토큰을 가린 형식으로 남긴다(default.conf의 log_format runkk_safe)
access_log /var/log/nginx/access.log runkk_safe;

# 실시간 대결·크루런 WebSocket(설계 5.7.2, D-06). Upgrade 헤더를 넘기고, 러닝 한 회 동안 연결이 끊기지 않게 읽기 제한을 길게 둔다
location /ws {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 2h;
    proxy_send_timeout 2h;
}

# API 문서(springdoc /docs·/swagger-ui·/v3/api-docs)는 외부에 열지 않는다(결정 D80, sqa DF-001). 8443도 베타 테스터에게 열리므로
# 같이 막는다. 팀원은 서버에서 api 컨테이너로 직접 본다(docker exec … curl localhost:8080/v3/api-docs).
location ~ ^/(docs|swagger-ui|swagger-ui\.html)(/|$) {
    return 404;
}
# /v3/api-docs는 접두사로 막는다. springdoc이 같은 문서를 내는 /v3/api-docs.yaml도 여기에 걸린다(코드 리뷰 BE10-3)
location ^~ /v3/api-docs {
    return 404;
}

# 외부에는 /actuator/health만 연다(배포 스모크용). info·prometheus 등 나머지 actuator 경로는 숨긴다
location = /actuator/health {
    proxy_pass http://$api_management_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
}

location ^~ /actuator/ {
    return 404;
}

# Android App Links 도메인 검증 파일(친구 대결 초대 링크, 설계 05-06 D-219, 05-08 6절).
# 운영·베타 앱 지문만 둔다(결정 D66, infra/README.md 10절). 서명 키를 바꾸면 이 파일도 바꾼다(코드 리뷰 BE10-6).
location = /.well-known/assetlinks.json {
    root /usr/share/nginx/runkk;
    default_type application/json;
    add_header Cache-Control "public, max-age=300";
    try_files /.well-known/assetlinks.json =404;
}

# 카카오톡 공유 카드 이미지(05-08 D-293)
# 앱 링크 경로(/invite/battle/) 밖에 둔다. 안에 두면 앱 링크가 그림 주소를 가로챈다
location = /invite/card.png {
    root /usr/share/nginx/runkk;
    add_header Cache-Control "public, max-age=86400";
    try_files /invite/card.png =404;
}

# 친구 대결 초대 링크(https://…/invite/battle/{token}). 앱이 있으면 App Links로 앱이 열고, 없을 때만 이 스토어 안내 페이지를 본다.
# 토큰은 앱이 경로에서 읽으므로 서버는 모든 토큰에 같은 페이지를 준다(api로 넘기지 않는다)
location ^~ /invite/battle/ {
    root /usr/share/nginx/runkk;
    charset utf-8;
    default_type text/html;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex";
    try_files /invite/battle/index.html =404;
}

# 공개 홈과 법정 고지 문서(개인정보 처리방침·이용약관·위치정보 이용약관·도움말). Google OAuth 동의 화면과 앱 설정 링크
# (application.yml runkk.legal.*-url)가 연다. 파일은 infra/nginx/static을 읽기 전용으로 연결한다. /legal/privacy → privacy.html
location = / {
    root /usr/share/nginx/runkk;
    charset utf-8;
    try_files /index.html =404;
}

location ^~ /legal/ {
    root /usr/share/nginx/runkk;
    charset utf-8;
    try_files $uri $uri.html =404;
}

# 이벤트 상세 웹 페이지(앱 웹뷰, S15P31A207-275). 파일은 infra/nginx/static/events/{slug}/index.html과 같은 폴더의 그림이다.
# 목록과 내 참여는 api(/api/v1/events)가 주고 이 경로는 api로 넘기지 않는다. 앱 업데이트 없이 고치므로 캐시는 짧게 둔다
# 페이지는 앱 브리지로 로그인 토큰을 받으므로 같은 서버 자원만 쓰게 콘텐츠 보안 정책을 건다(페이지는 문서 안 스크립트와 스타일, 같은 폴더 그림,
# 같은 서버 /api/v1/events/{slug}/me fetch만 쓴다). 다른 서버 스크립트, 프레임, 폼 전송, 다른 사이트에 끼워 넣기를 막는다
location ^~ /events/ {
    root /usr/share/nginx/runkk;
    charset utf-8;
    add_header Cache-Control "public, max-age=60";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
    try_files $uri $uri/index.html =404;
}

location / {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
