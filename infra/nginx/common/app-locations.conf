# 런크크 api 공통 경로. prod(443)·develop(8443) server 블록이 include한다(http·https 두 모드 공통).
# include하는 server가 $api_upstream·$api_management_upstream을 먼저 정한다. 변수로 proxy_pass를 쓰므로 nginx가 요청 때 이름을 풀어
# resolver(default.conf)를 따르고, 그 환경 api가 내려가 있어도 nginx는 뜨며 그 포트만 502가 난다(URI를 붙이지 않아 원래 경로가 그대로 넘어간다).
# 이 폴더는 envsubst를 거치지 않는다. ${...} 대신 nginx 변수만 쓴다.

client_max_body_size 10m;

# 접근 로그는 토큰을 가린 형식으로 남긴다(default.conf의 log_format runkk_safe)
access_log /var/log/nginx/access.log runkk_safe;

# 쉬는 연결 유지 시간. 이미지 기본 nginx.conf의 65초를 이 server에서만 300초로 늘린다(http 단에 다시 쓰면 중복 오류).
# 앱(OkHttp)은 쉬는 연결을 5분 동안 다시 쓰므로 맞춰 두면 화면을 오갈 때 TLS 핸드셰이크를 다시 하지 않는다. HTTP/2도 이 값을 쓴다(S15P31A207-300)
keepalive_timeout 300s;

# 봇 요청 차단. 운영 접근 로그에 쌓이는 취약점 탐색 요청을 api로 넘기지 않고 응답 없이 끊는다(444).
# 이 server가 쓰는 경로(/api, /ws, /actuator/health, /legal, /events, /invite, /.well-known/assetlinks.json, /, /grafana)와 겹치지 않는
# 명백한 패턴만 막는다. ^~ 접두 location(/legal/, /events/, /invite/…, /grafana/)은 정규식보다 먼저 정해지므로 영향이 없다(S15P31A207-300)
#   점으로 시작하는 경로 조각(/.env, /.git/config, /.aws/…). /.well-known/은 App Links·ACME가 쓰므로 뺀다
location ~ /\.(?!well-known/) {
    return 444;
}
#   서버 측 스크립트 확장자(런크크는 PHP·ASP·JSP·CGI를 쓰지 않는다)
location ~* \.(php[0-9]?|phtml|aspx?|jsp|cgi)$ {
    return 444;
}
#   흔한 CMS·관리 도구 탐색 경로
location ~* ^/(wp-|wordpress|xmlrpc|phpmyadmin|pma/|cgi-bin/|vendor/phpunit|boaform|hnap1) {
    return 444;
}

# 실시간 대결·크루런 WebSocket(설계 5.7.2, D-06). Upgrade 헤더를 넘기고, 러닝 한 회 동안 연결이 끊기지 않게 읽기 제한을 길게 둔다
location /ws {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 2h;
    proxy_send_timeout 2h;
}

# API 문서(springdoc /docs·/swagger-ui·/v3/api-docs)는 외부에 열지 않는다(결정 D80, sqa DF-001). 8443도 베타 테스터에게 열리므로
# 같이 막는다. 팀원은 서버에서 api 컨테이너로 직접 본다(docker exec … curl localhost:8080/v3/api-docs).
location ~ ^/(docs|swagger-ui|swagger-ui\.html)(/|$) {
    return 404;
}
# /v3/api-docs는 접두사로 막는다. springdoc이 같은 문서를 내는 /v3/api-docs.yaml도 여기에 걸린다(코드 리뷰 BE10-3)
location ^~ /v3/api-docs {
    return 404;
}

# 외부에는 /actuator/health만 연다(배포 스모크용). info·prometheus 등 나머지 actuator 경로는 숨긴다
location = /actuator/health {
    proxy_pass http://$api_management_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
}

location ^~ /actuator/ {
    return 404;
}

# Android App Links 도메인 검증 파일(친구 대결 초대 링크, 설계 05-06 D-219, 05-08 6절).
# 운영·베타 앱 지문만 둔다(결정 D66, infra/README.md 10절). 서명 키를 바꾸면 이 파일도 바꾼다(코드 리뷰 BE10-6).
location = /.well-known/assetlinks.json {
    root /usr/share/nginx/runkk;
    default_type application/json;
    add_header Cache-Control "public, max-age=300";
    try_files /.well-known/assetlinks.json =404;
}

# 카카오톡 공유 카드 이미지(05-08 D-293)
# 앱 링크 경로(/invite/battle/) 밖에 둔다. 안에 두면 앱 링크가 그림 주소를 가로챈다
location = /invite/card.png {
    root /usr/share/nginx/runkk;
    add_header Cache-Control "public, max-age=86400";
    try_files /invite/card.png =404;
}

# 같은 카드의 JPEG(약 100KB, PNG 538KB의 1/5, S15P31A207-329). 앱 v0.14부터 이 주소를 쓴다. 옛 앱은 위 PNG를 계속 쓴다
location = /invite/card.jpg {
    root /usr/share/nginx/runkk;
    add_header Cache-Control "public, max-age=86400";
    try_files /invite/card.jpg =404;
}

# 친구 대결 초대 링크(https://…/invite/battle/{token}). 앱이 있으면 App Links로 앱이 열고, 없을 때만 이 스토어 안내 페이지를 본다.
# 토큰은 앱이 경로에서 읽으므로 서버는 모든 토큰에 같은 페이지를 준다(api로 넘기지 않는다)
location ^~ /invite/battle/ {
    # 정적 문서 압축(v0.14 S15P31A207-329). html은 gzip on이면 늘 압축하고, 나머지는 아래 형식만. 1KB 미만은 그대로 보낸다
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
    root /usr/share/nginx/runkk;
    charset utf-8;
    default_type text/html;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex";
    try_files /invite/battle/index.html =404;
}

# 크루 초대 링크(https://…/invite/crew/{CODE}, 설계 05-31 [임시:D-성-237]·[임시:D-성-239]). 대결 초대와 경로 접두어가 달라 서로 섞이지 않는다.
# 앱이 있으면 App Links로 앱이 열고, 없거나 이 경로를 모르는 옛 앱(0.12.0)이면 이 스토어 안내 페이지를 본다.
# 코드는 앱이 경로에서 읽으므로 서버는 모든 코드에 같은 페이지를 준다(api로 넘기지 않는다)
location ^~ /invite/crew/ {
    # 정적 문서 압축(v0.14 S15P31A207-329). html은 gzip on이면 늘 압축하고, 나머지는 아래 형식만. 1KB 미만은 그대로 보낸다
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
    root /usr/share/nginx/runkk;
    charset utf-8;
    default_type text/html;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex";
    try_files /invite/crew/index.html =404;
}

# 공개 홈과 법정 고지 문서(개인정보 처리방침·이용약관·위치정보 이용약관·도움말). Google OAuth 동의 화면과 앱 설정 링크
# (application.yml runkk.legal.*-url)가 연다. 파일은 infra/nginx/static을 읽기 전용으로 연결한다. /legal/privacy → privacy.html
location = / {
    # 정적 문서 압축(v0.14 S15P31A207-329). html은 gzip on이면 늘 압축하고, 나머지는 아래 형식만. 1KB 미만은 그대로 보낸다
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
    root /usr/share/nginx/runkk;
    charset utf-8;
    try_files /index.html =404;
}

location ^~ /legal/ {
    # 정적 문서 압축(v0.14 S15P31A207-329). html은 gzip on이면 늘 압축하고, 나머지는 아래 형식만. 1KB 미만은 그대로 보낸다
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
    root /usr/share/nginx/runkk;
    charset utf-8;
    try_files $uri $uri.html =404;
}

# 이벤트 상세 웹 페이지(앱 웹뷰, S15P31A207-275). 파일은 infra/nginx/static/events/{slug}/index.html과 같은 폴더의 그림이다.
# 목록과 내 참여는 api(/api/v1/events)가 주고 이 경로는 api로 넘기지 않는다. 앱 업데이트 없이 고치므로 캐시는 짧게 둔다
# 페이지는 앱 브리지로 로그인 토큰을 받으므로 같은 서버 자원만 쓰게 콘텐츠 보안 정책을 건다(페이지는 문서 안 스크립트와 스타일, 같은 폴더 그림,
# 같은 서버 /api/v1/events/{slug}/me fetch만 쓴다). 다른 서버 스크립트, 프레임, 폼 전송, 다른 사이트에 끼워 넣기를 막는다
location ^~ /events/ {
    # 정적 문서 압축(v0.14 S15P31A207-329). html은 gzip on이면 늘 압축하고, 나머지는 아래 형식만. 1KB 미만은 그대로 보낸다
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
    root /usr/share/nginx/runkk;
    charset utf-8;
    add_header Cache-Control "public, max-age=60";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
    try_files $uri $uri/index.html =404;

    # 판(내용 해시 8자리)을 이름에 넣은 그림(banner.59e500fa.png 등)은 내용이 바뀌면 이름도 바뀌므로 하루 두고 다시 묻지 않는다
    # (S15P31A207-329). 그림을 바꿀 때는 새 해시 이름으로 올리고 event 행의 주소를 바꾼다(옛 이름 파일은 옛 앱을 위해 남긴다)
    location ~ "^/events/[^/]+/[^/]+\.[0-9a-f]{8}\.(png|webp|jpg)$" {
        root /usr/share/nginx/runkk;
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }
}

# 러닝 기록 업로드(POST /api/v1/runs)만 본문 상한을 32MB로 둔다(MR !91 CR2-B2). 위치 43,200개(12시간)·심박·움직임 표본 86,400개를 실으면
# 본문이 10MB를 넘어 413을 받고, 앱은 4xx 기록을 다시 보내지 않아 저장되지 않았다. 앱은 본문을 24MB 안으로 맞춰 보낸다
# (RunMappers.toFittedRequest). 다른 경로는 위의 10m 그대로다.
location = /api/v1/runs {
    client_max_body_size 32m;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# 아바타 머리·셀카 결과(GET /api/v1/avatar/heads/{ownerId}/{jobId}, /selfie/latest 등)는 1024 PNG 레이어를 Base64로 담아 응답 하나가 수 MB다
# (운영 7일 전송량의 93%). 기본 버퍼(8×4k)로는 대부분을 임시 파일에 썼다가 다시 읽으므로 이 경로만 메모리 버퍼를 키운다.
# 버퍼는 응답을 받을 때 필요한 만큼만 잡히고(최대 128k + 64×128k ≈ 8MB/요청) 응답을 다 보내면 놓는다. 동시에 느린 클라이언트 50명이면
# 최악 약 400MB다(서버 15GiB, 사용 4.5GiB). 8MB를 넘는 부분은 전처럼 임시 파일로 넘긴다(proxy_max_temp_file_size 기본 1024m)(S15P31A207-300)
# 이름 끝에 "/"를 붙이지 않는다. "/api/v1/avatar/"로 쓰면 nginx가 GET /api/v1/avatar(내 아바타)를 /api/v1/avatar/로 301 보내고
# api가 404를 낸다(v0.13.3 장애, ai/tests/test_nginx_config.py). "/"가 없으면 /api/v1/avatar와 그 아래 주소를 모두 그대로 넘긴다
location ^~ /api/v1/avatar {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffer_size 128k;
    proxy_buffers 64 128k;
    proxy_busy_buffers_size 256k;
}

location / {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
