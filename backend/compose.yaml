# Local PostgreSQL + Redis for the develop profile (optional; the local profile needs nothing).
#   docker compose up -d
#   DB_PASSWORD=runkk ./gradlew bootRun --args='--spring.profiles.active=develop'
#   (develop 프로필은 DB 비밀번호 기본값이 없다. PowerShell: $env:DB_PASSWORD='runkk'; ./gradlew bootRun ...)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: runkk
      POSTGRES_USER: runkk
      POSTGRES_PASSWORD: runkk
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  postgres-data:
