# Local PostgreSQL + Redis for the develop profile (optional; the local profile needs nothing).
#   docker compose up -d
#   ./gradlew bootRun --args='--spring.profiles.active=develop'
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: runkk
      POSTGRES_USER: runkk
      POSTGRES_PASSWORD: runkk
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  postgres-data:
