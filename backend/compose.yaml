# Local MySQL + Redis for the develop profile (optional; the local profile needs nothing).
#   docker compose up -d
#   ./gradlew bootRun --args='--spring.profiles.active=develop'
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: runkk
      MYSQL_USER: runkk
      MYSQL_PASSWORD: runkk
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
  redis:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  mysql-data:
