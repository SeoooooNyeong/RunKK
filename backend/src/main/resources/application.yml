# Profiles
#   local   (default) developer PC. Nothing to install: H2 in-memory DB (PostgreSQL mode) + embedded Redis start with the app.
#   develop develop-branch deployment (EC2 dev stack) or a PC with docker compose (see compose.yaml).
#   prod    main-branch deployment. Every value comes from the .env file on the server.
#   test    used by @SpringBootTest only (src/test/resources/application-test.yml).
spring:
  application:
    name: runkk
  profiles:
    default: local
  # 스키마는 Flyway 마이그레이션(src/main/resources/db/migration/V{n}__{설명}.sql)이 원본이다.
  # develop·prod는 Flyway + ddl validate, local·test는 Flyway 끄고 H2 create-drop.
  flyway:
    enabled: false
    baseline-on-migrate: true
  # 기록 저장 커밋 뒤 동기 수신자(티어·리워드·주간 거리·크루런 연결, D-03)는 원래 연결을 쥔 채 REQUIRES_NEW로 연결을 하나 더 쓴다.
  # 동시 업로드가 풀을 모두 잡고 두 번째 연결을 기다리며 멈추지 않도록 풀을 동시 사용자 규모(NFR-002 50명)에 맞춘다.
  # PostgreSQL max_connections(기본 100) 안이어야 한다. 인스턴스를 늘리면(E-05) 인스턴스 수 × 풀 크기로 다시 잡는다.
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:50}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
  # 비동기 사건 수신자(리포트·Runimal, D-03·배경 해금 BackgroundUnlockListener·채팅 방 밖 알림 ChatDeliveryListener) 실행기. 인스턴스 1개·동시 50명(5.4) 규모. 종료 때 진행 중 작업을 30초까지 기다린다(1단계 리뷰 M6·L2).
  task:
    # 주기 작업은 26개다(코치 대화 색인 만료 포함). 같은 시각 작업과 1초 시계가 서로 기다리지 않게
    # 스케줄러 스레드를 작업 수만큼 둔다(5.5, B5 리뷰 "풀 2개로 3시·0시 작업이 겹침", MR !91 BR-4 런바디 5초 작업 추가).
    # 작업을 더하면 이 값도 늘린다(BootstrapConfigTest가 등록 수와 비교한다).
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:26}
      thread-name-prefix: runkk-schedule-
    execution:
      thread-name-prefix: runkk-async-
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 500
      shutdown:
        await-termination: true
        await-termination-period: 30s
  # 셀카 업로드(POST /avatar/selfie, D-59): 앱이 1MB 이하로 줄여 보낸다. file-size-threshold를 max-file-size보다 크게 두어
  # multipart를 디스크 임시 파일 없이 메모리로만 받는다(셀카는 어디에도 저장하지 않는다, FR-156). 컨테이너 /tmp는 tmpfs다.
  # 크루 게시글(POST /crews/{id}/board-posts, D-100)은 사진 5장 × 1MB라 요청 전체를 6MB까지 받는다(nginx 10m 안).
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 6MB
      file-size-threshold: 2MB
  # 회원 인증은 web.auth.AuthFilter(JWT)만 쓴다. Boot 기본 사용자(user + 생성 비밀번호)를 만들지 않는다(1단계 리뷰 L11).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # JSON 응답 gzip(2026-11-01 사용자 결정 W24, 코드 리뷰 12차 BE12-1). 워치가 미리 받는 셀럽 상대 기록은 1초 1점이라 풀코스 하나가 약 340KB다.
  # Accept-Encoding: gzip을 보낸 요청만 압축한다(OkHttp는 자동으로 보내고 푼다). 하한 2KB는 길이를 아는 응답에만 걸리고, 길이 없이 흘려 쓰는
  # Jackson JSON 응답은 작아도 압축된다(gzip 머리 약 20바이트 늘 뿐 값은 같다).
  # nginx는 gzip을 켜지 않고(기본 off) Accept-Encoding을 그대로 넘기며 압축 응답을 다시 압축하지 않는다(infra/nginx/common/app-locations.conf).
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 2KB

# prometheus는 모니터링(S15P31A207-78, infra/monitoring)의 Prometheus가 읽는다. develop·prod는 관리 포트를 따로 두어(아래 프로필)
# 서비스 포트(nginx가 넘기는 8080)에는 actuator가 없고 compose 내부 망에서만 읽힌다. nginx는 바깥에 /actuator/health 하나만 넘긴다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    # 응답 시간 p95를 Grafana에서 계산할 히스토그램 버킷. 백분위 히스토그램 전체(버킷 수십 개)를 켜지 않고 경계만 둔다
    distribution:
      slo:
        "[http.server.requests]": 50ms,100ms,200ms,500ms,1s,2s,5s

springdoc:
  # 컨트롤러마다 중첩 DTO(record Day, Entry …) 이름이 겹치므로 스키마 이름을 패키지 포함 이름으로 둔다(앱–서버 대조 제안).
  use-fqn: true
  swagger-ui:
    path: /docs

# 런크크 설정. 키·토큰은 환경 변수로만 받는다(.env, 커밋 금지). 비어 있으면 그 연동은 꺼진 채로 안전하게 동작한다.
runkk:
  avatar:
    # 배경 해금 조회 채우기 기준 시각(D-176): V25 적용 시각. 이 시각 이전에 저장한 유효 기록의 거리만 알림 없이 채운다. 배포 때 실제 적용 시각으로 맞춘다.
    backfill-cutoff: ${AVATAR_BACKFILL_CUTOFF:2026-10-22T00:00:00}
  # 친구 대결 초대 링크 앞부분(v0.14 D-219, web.battle.FriendInviteLinks). 링크 = link-base + "/" + 토큰.
  # 기본값이 없다. develop·prod는 환경마다(release 8443, prod 443) FRIEND_INVITE_LINK_BASE를 넣어야 하고 비면 기동이 실패한다(FriendInviteLinks).
  # local은 아래 프로필에서, 시험은 application-test·integration.yml에서 채운다. Android App Links는 이 도메인의 /.well-known/assetlinks.json을 본다
  battle:
    friend-invite:
      link-base: ${FRIEND_INVITE_LINK_BASE:}
  # 법정 고지 문서 공개 주소(FR-018, member.LegalDocumentCatalog)
  legal:
    terms-url: ${LEGAL_TERMS_URL:https://k15a207.p.ssafy.io/legal/terms}
    privacy-policy-url: ${LEGAL_PRIVACY_POLICY_URL:https://k15a207.p.ssafy.io/legal/privacy}
    location-terms-url: ${LEGAL_LOCATION_TERMS_URL:https://k15a207.p.ssafy.io/legal/location}
    help-url: ${LEGAL_HELP_URL:https://k15a207.p.ssafy.io/legal/help}
  auth:
    # 회원 JWT 서명 키(HS256, 32바이트 이상). 비면 기동 때마다 임의 키를 만든다(재시작하면 기존 토큰 무효, D-19). prod는 비면 기동 실패(ProductionSecretsCheck).
    jwt-secret: ${JWT_SECRET:}
    # 관리툴 토큰 서명 키(HS256, 32바이트 이상, 회원 키와 달라야 한다, D-42). 비면 기동 때마다 임의 키(관리툴 재로그인 필요). prod는 비면 기동 실패.
    admin-jwt-secret: ${ADMIN_JWT_SECRET:}
    kakao:
      base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
      # 토큰을 발급한 앱 ID. 비면 카카오 로그인은 "로그인 제공자 연결 실패"로 거부한다(다른 앱 토큰 대입 방지).
      app-id: ${KAKAO_APP_ID:}
    # 공개 인증 경로(로그인·갱신·가입) 시도 제한(코드 리뷰 2차 M5, web.auth.AuthAttemptGuard). 넘으면 429 TOO_MANY_ATTEMPTS.
    attempts:
      client-requests: ${AUTH_CLIENT_REQUESTS_PER_MINUTE:30}
      request-window: 1m
      client-failures: 10
      credential-failures: 5
      failure-window: 10m
      # 게스트 생성(POST /members/guest) 접속지별 한도(FR-197, D-89 (4)): 1시간에 10회
      guest-starts: 10
      guest-start-window: 1h
      # 워치 세션 발급(POST /auth/watch-session, D-372) 회원별 한도: 1시간에 20회. 접근 토큰 하나로 갱신 토큰을 끝없이 만들지 못하게 한다
      watch-sessions: 20
      watch-session-window: 1h
    google:
      base-url: ${GOOGLE_TOKENINFO_BASE_URL:https://oauth2.googleapis.com}
      # ID 토큰 aud로 받을 OAuth 클라이언트 ID(쉼표 구분). 비면 구글 로그인을 거부한다.
      client-ids: ${GOOGLE_CLIENT_IDS:}
  push:
    fcm:
      # 둘 다 있어야 FCM으로 보낸다. 없으면 발송하지 않고 운영 로그만 남긴다(FR-175).
      project-id: ${FCM_PROJECT_ID:}
      credentials-file: ${FCM_CREDENTIALS_FILE:}
  weather:
    kma:
      base-url: ${KMA_API_BASE_URL:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
      # 공공데이터포털 서비스 키. 비면 날씨 없이 저장한다(FR-184).
      service-key: ${KMA_SERVICE_KEY:}
  # api → ai 서버(D-58, infra.integration.ai.AiServerClient). 통합 compose가 AI_SERVER_URL·RUNKK_INTERNAL_TOKEN으로 넘긴다. 토큰은 prod 필수.
  ai:
    server-url: ${AI_SERVER_URL:http://localhost:8000}
    internal-token: ${RUNKK_INTERNAL_TOKEN:}
    comment-timeout: 3s
    face-timeout: 15s
    writer-model-urls: ${RUNKK_WRITER_MODEL_URLS:http://writer:8080}
  # 서버 스위치(policy.OperationPolicy). selfie-enabled가 false면 관리툴 운영 기준값 SELFIE_ENABLED와 관계없이 셀카 변환을 막는다(SELFIE_DISABLED).
  # 로컬·시험은 켜 두고, 배포 compose는 기본 꺼짐이다(infra/docker-compose.yml SELFIE_ENABLED, 베타 prod는 꺼짐 2026-10-23 결정)
  features:
    selfie-enabled: ${SELFIE_ENABLED:true}
  # 매칭 대기열·진행 중 대결 세션 저장소(D-07): redis(기본) | jdbc(Redis 장기 장애 때 PostgreSQL 대안, 5.5)
  queue: ${RUNKK_QUEUE:redis}
  # 실시간 방식(D-06, C-004): websocket(기본, /ws) | polling(/api/v1/live/poll·progress, /ws를 열지 않음, D-57)
  live: ${RUNKK_LIVE:websocket}
  batch:
    # 대결 시계(Matchmaker·BattleClockService·LiveBattleService, D-39). 시험 프로필은 끄고 연산을 직접 부른다.
    battle-tick-enabled: true
    battle-tick-interval: 1s
    # 출발하지 못한 대결 정리(시작 보고 없이 10분 지난 기록 대결 등 → CANCELLED, 활성 대결 1개 불변식 결정)
    battle-abandon-interval: 1m
    # 친구 대결 초대 만료 정리(생성 + 5분 지난 대기 초대 → EXPIRED, 초대한 앱에 FriendInviteExpired, v0.14 D-221)
    friend-invite-expiry-interval: 5s
    # 런바디 ai 분석 작업 진행(제출 대기 → 제출, 분석 중 → 상태 조회, 05-19 D-443). RUNBODY_ENABLED가 꺼져 있으면 바로 돌아온다. 시험 프로필은 끈다.
    runbody-poll-enabled: true
    runbody-poll-interval: 5s
    # Runimal 유형 비율 재계산(16유형 상세의 "러너 중 n%", v0.14 D-246)
    runimal-share-cron: "0 0 0 * * *"
    # 기동 뒤 기록 목록 썸네일 경로 모양 되채우기(v0.14 D-234). 끝나면 남은 것이 없어 조회 한 번으로 끝난다
    route-shape-backfill:
      enabled: ${ROUTE_SHAPE_BACKFILL_ENABLED:true}
    withdrawal-purge-cron: "0 0 3 * * *"
    # 만료된 갱신 토큰 폐기 목록 행 정리(M6 후속 결정, refresh_token_revocation)
    revocation-purge-cron: "0 0 3 * * *"
    # 1년(365일) 미접속 게스트 파기(FR-200, D-156)
    idle-guest-withdrawal-cron: "0 0 3 * * *"
    disposal-cron: "0 0 3 * * *"
    # 보관 기한 지난 알림 정리는 매일 0시(srs 소단위명세 7.3, D-67, 부록 E K-3)
    notification-purge-cron: "0 0 0 * * *"
    # 크루런 시계(CrewRunService.tick·CrewRunLiveService.detectTimeouts, D-39). 시험 프로필은 끄고 연산을 직접 부른다.
    crew-tick-enabled: true
    crew-tick-interval: 1s
    # 투표 마감 1시간 전 알림(PollReminderJob, FR-218, D-106): 1분 간격
    poll-reminder-interval: 1m
    # 크루 주간 거리 재합산(D-38, 0시 작업 셋과 겹치지 않게 0시 30분 D-88, 부록 E K-4), 가입 신청 만료(Q-40), 아바타 외형 재계산(N-18)
    weekly-race-reconcile-cron: "0 30 0 * * *"
    # 커밋 뒤 수신자 유실분 일 단위 보정(코드 리뷰 2차 M4 결정): 리워드 적립, 크루런 기록 연결. 전날이 끝난 뒤 최근 2일을 다시 본다.
    reward-reconcile-cron: "0 10 0 * * *"
    crew-run-link-reconcile-cron: "0 10 0 * * *"
    # 티어 갱신 보정(D-108, L16): 리스너가 놓친 유효 러닝 순번을 최근 2일 저장 기록으로 다시 넘긴다
    tier-reconcile-cron: "0 10 0 * * *"
    # 랜드마크 배경 해금 보정(D-107 (3)): 커밋 뒤 비동기 수신자가 놓친 해금을 최근 2일 저장 기록 회원으로 다시 채운다
    background-reconcile-cron: "0 10 0 * * *"
    # 배치고사 판 셈 누락 복구(D-490): 판정 사건 수신자가 놓친 판을 최근 7일 끝난 배치고사 대결로 다시 센다(티어 보정 0시 10분 다음)
    placement-reconcile-cron: "0 20 0 * * *"
    join-request-expiry-cron: "0 0 3 * * *"
    appearance-refresh-cron: "0 0 0 * * *"
    # 랭킹 스냅숏 재집계(D-25, FR-070), 계획 미이행 알림(FR-075), 감사 기록 6개월 정리(FR-176)
    ranking-rebuild-cron: "0 0 0 * * *"
    plan-reminder-cron: "0 0 20 * * *"
    audit-purge-cron: "0 0 3 * * *"
    # 보존 기간(1년)이 지난 날짜별 계획·주간 목표 행 정리(B5 리뷰)
    plan-purge-cron: "0 30 3 * * *"
  # 관리툴 첫 운영자(code-review U10, FR-173)는 환경 변수 RUNKK_BOOTSTRAP_OPERATORS("KAKAO:계정ID,GOOGLE:계정ID")가
  # runkk.bootstrap.operators로 바로 묶인다. 화이트리스트가 비었을 때만 시작 때 한 번 넣는다. 변수가 없으면 시드 없음(로그 없음),
  # 빈 문자열이면 WARN 1줄(D-166)이라 여기에 빈 기본값을 두지 않는다.
  # 운영 기준값 시드(S15P31A207-222)는 환경 변수 RUNKK_BOOTSTRAP_SETTINGS("CREW_RELEASED=true,AVATAR_RELEASED=true", 값은 관리툴과 같은 JSON)가
  # runkk.bootstrap.settings로 묶인다. 그 키의 행이 없을 때만 시작 때 한 번 넣고, 모르는 키·형식 오류는 WARN 뒤 건너뛰고, 변수가 없거나 비면 아무것도 하지 않는다.

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:runkk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        hbm2ddl:
          # import.sql(local·test 공통) 다음에 local 전용 초기 데이터(셀럽 기록, Flyway V32와 같은 행)를 넣는다. 한글이 있어 UTF-8로 읽는다
          import_files: import.sql,import-local.sql
          charset_name: UTF-8
  data:
    redis:
      host: localhost
      port: ${EMBEDDED_REDIS_PORT:6370}

# Redis health indicator parses INFO as java.util.Properties; the embedded Windows binary reports a path that breaks it.
management:
  health:
    redis:
      enabled: false

runkk:
  battle:
    friend-invite:
      link-base: ${FRIEND_INVITE_LINK_BASE:http://10.0.2.2:8080/invite/battle}
  embedded-redis:
    enabled: true
    port: ${EMBEDDED_REDIS_PORT:6370}


# local은 인증 없는 h2-console과 기동마다 바뀌는 JWT 키로 뜨므로 기본으로 이 PC에서만 받는다(코드 리뷰 2차 L19).
# 실기기 시험처럼 같은 망에서 붙어야 하면 SERVER_ADDRESS=0.0.0.0으로 연다(에뮬레이터 10.0.2.2는 이 PC의 루프백이라 그대로 된다).
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
---
spring:
  config:
    activate:
      on-profile: develop
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:runkk}
    username: ${DB_USER:runkk}
    # 비밀번호는 기본값을 두지 않는다(코드 리뷰 2차 L27): 빠지면 기동이 멈춘다. 로컬 compose.yaml은 DB_PASSWORD=runkk로 띄운다
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    # 배치고사 V35_1(버전 35.1, 핫픽스 v0.11.1)은 develop DB에 이미 V36·V37이 있어 적용 안 된 낮은 번호가 된다.
    # develop 프로필만 순서 밖 적용을 켠다(05-21 D-476·D-514). prod는 켜지 않는다. 이벤트 V35_2(35.2)와 공지 알림 V35_3(35.3, 둘 다
    # 핫픽스 v0.11.4)도 같은 이유로 이 설정으로 받는다. 35.1, 35.2, 35.3이 develop DB에 모두 적용된 뒤에만 지운다(먼저 지우면 develop api가
    # Flyway 검증에서 멈춘다).
    out-of-order: true
    # V29가 만드는 ai 전용 DB 계정 runkk_ai의 비밀번호(S15P31A207-172). 기본값이 없어 빠지면 기동이 멈춘다.
    # ai .env의 RUNKK_DB_URL과 같은 값이어야 한다
    placeholders:
      runkk_ai_password: ${RUNKK_AI_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis 비밀번호(코드 리뷰 2차 L27). 서버 Redis에 requirepass를 켜면 같은 값을 넣는다. 비면 비밀번호 없이 붙는다.
      password: ${REDIS_PASSWORD:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# 관리 포트(actuator). compose는 밖으로 열지 않고 api 컨테이너 healthcheck·nginx /actuator/health·Prometheus만 이 포트를 부른다
management:
  server:
    port: ${MANAGEMENT_PORT:8081}

logging:
  level:
    com.a207.runkk: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    # V29가 만드는 ai 전용 DB 계정 runkk_ai의 비밀번호(S15P31A207-172). 기본값이 없어 빠지면 기동이 멈춘다.
    # ai .env의 RUNKK_DB_URL과 같은 값이어야 한다
    placeholders:
      runkk_ai_password: ${RUNKK_AI_DB_PASSWORD}
  jpa:
