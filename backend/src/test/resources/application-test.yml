spring:
  # 시험 문맥마다 따로 H2 메모리 DB를 쓴다(${random.uuid}는 문맥마다 한 번 정해진다). 한 DB를 함께 쓰면 새 문맥이 뜰 때 create-drop이 표를 지우고
  # 회원 ID가 1부터 다시 매겨져, 앞 문맥의 탈퇴 표시(web.auth.ActiveMembers 메모리, 1시간)와 새 회원 ID가 겹쳐 인증이 401로 거부된다.
  datasource:
    url: jdbc:h2:mem:runkk-test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: ${EMBEDDED_REDIS_PORT:6371}

management:
  health:
    redis:
      enabled: false

runkk:
  battle:
    friend-invite:
      link-base: https://k15a207.p.ssafy.io/invite/battle
  # 시험 문맥 하나를 여러 시험 클래스가 함께 쓰고 요청이 모두 127.0.0.1이라 시도 제한을 넉넉히 둔다(AuthAttemptLimitTest가 따로 줄여 시험)
  auth:
    attempts:
      client-requests: 100000
      client-failures: 100000
      credential-failures: 100000
  batch:
    battle-tick-enabled: false
    crew-tick-enabled: false
    # 기동 뒤 경로 모양 되채우기(D-234)는 시험이 직접 부른다
    route-shape-backfill:
      enabled: false
  embedded-redis:
    enabled: true
    port: ${EMBEDDED_REDIS_PORT:6371}
