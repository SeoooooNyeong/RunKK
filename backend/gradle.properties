# google-java-format(Spotless)가 JDK 17+에서 javac 내부 API에 접근하려면 필요 (코드 컨벤션 4장)
org.gradle.jvmargs=-Xmx2g --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
# lint(spotless)·test 잡이 같은 컴파일 결과를 CI 캐시(.gradle/caches/build-cache-1)에서 다시 쓴다
org.gradle.caching=true
