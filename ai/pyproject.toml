[project]
name = "runkk-ai"
version = "0.1.0"
description = "런크크 ai 서버: AI 코멘트(/comments), 셀카 아바타 중계(/users/{userId}/faces), RUN바디 1회 분석(/sessions). api 컨테이너만 부르는 내부 서비스"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.150.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "anthropic==1.15.0",
    "openai==3.35.1",
    "httpx==0.28.1",
    "anyio==4.15.1",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "import-linter==2.15",
    "mypy==2.4.0",
    "pandas-stubs==3.0.5.260914",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runkk_ai"]

# ---------- ruff ----------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["runkk_ai", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["runkk_ai", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PT", "T20", "LOG", "G"]
ignore = [
    "RUF001", # 한국어 문구의 전각 문자 경고
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
# 학습 데이터 명령: 진행 상황을 화면에 찍고, seed로 다시 만들 수 있는 난수를 쓴다(보안 용도 아님)
"runkk_ai/writer/dataset/**" = ["T201", "S311"]
# Colab 노트북: 셀마다 import하고 결과를 찍어 본다
"notebooks/**" = ["E402", "T201", "S101", "PT018"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers"]

[tool.coverage.run]
source = ["runkk_ai"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
packages = ["runkk_ai"]
strict = true
plugins = ["pydantic.mypy"]

# ---------- import-linter (13.3, 14장, D-60) ----------
[tool.importlinter]
root_package = "runkk_ai"

[[tool.importlinter.contracts]]
name = "core·comment·face·runbody·privacy는 서로 import하지 않는다 (D-60)"
type = "independence"
modules = ["runkk_ai.core", "runkk_ai.comment", "runkk_ai.face", "runkk_ai.runbody", "runkk_ai.privacy"]

[[tool.importlinter.contracts]]
name = "core·comment·face·runbody·storage는 main을 import하지 않는다 (main → 기능 모듈 한 방향)"
type = "forbidden"
source_modules = [
    "runkk_ai.core",
    "runkk_ai.comment",
    "runkk_ai.face",
    "runkk_ai.runbody",
    "runkk_ai.storage",
    "runkk_ai.writer",
    "runkk_ai.coach",
    "runkk_ai.privacy",
]
forbidden_modules = ["runkk_ai.main"]

[[tool.importlinter.contracts]]
name = "privacy: 라우터 → 서비스 한 방향. 저장소는 purge_user 규약으로만 안다"
type = "layers"
layers = ["runkk_ai.privacy.router", "runkk_ai.privacy.service"]

[[tool.importlinter.contracts]]
name = "comment: 라우터 → 서비스 → 추상 클라이언트 한 방향"
type = "layers"
layers = [
    "runkk_ai.comment.router",
    "runkk_ai.comment.service",
    "runkk_ai.comment.prompt | runkk_ai.comment.llm",
    "runkk_ai.comment.schemas",
]

[[tool.importlinter.contracts]]
name = "face: 라우터 → 서비스 → 아바타 클라이언트 → 응답 형식 한 방향"
type = "layers"
layers = [
    "runkk_ai.face.router",
    "runkk_ai.face.service",
    "runkk_ai.face.client",
    "runkk_ai.face.schemas",
]

[[tool.importlinter.contracts]]
name = "runbody: 라우터 → 서비스 → 엔진·저장소·월간 → 피드백 → 코칭·점수·부하 → 지표·전처리 한 방향"
type = "layers"
layers = [
    "runkk_ai.runbody.router | runkk_ai.runbody.monthly_router",
    "runkk_ai.runbody.service | runkk_ai.runbody.monthly_service",
    "runkk_ai.runbody.engine | runkk_ai.runbody.repository | runkk_ai.runbody.monthly",
    "runkk_ai.runbody.feedback",
    "runkk_ai.runbody.coaching | runkk_ai.runbody.scoring | runkk_ai.runbody.load",
    "runkk_ai.runbody.metrics | runkk_ai.runbody.preprocess",
    "runkk_ai.runbody.schemas",
]

[[tool.importlinter.contracts]]
name = "storage는 runbody 규약(repository·schemas)을 구현한다. 어느 기능 모듈도 storage를 모른다 (main이 끼운다)"
type = "forbidden"
source_modules = ["runkk_ai.core", "runkk_ai.comment", "runkk_ai.face", "runkk_ai.runbody", "runkk_ai.privacy"]
forbidden_modules = ["runkk_ai.storage"]

[[tool.importlinter.contracts]]
name = "storage는 runbody의 라우터·서비스·엔진을 부르지 않는다"
type = "forbidden"
source_modules = ["runkk_ai.storage"]
forbidden_modules = [
    "runkk_ai.runbody.router",
    "runkk_ai.runbody.monthly_router",
    "runkk_ai.runbody.service",
    "runkk_ai.runbody.monthly_service",
    "runkk_ai.runbody.engine",
    "runkk_ai.runbody.monthly",
    "runkk_ai.comment",
    "runkk_ai.face",
    "runkk_ai.core",
]

[[tool.importlinter.contracts]]
name = "storage: 저장소·마이그레이션 → 연결·테이블 한 방향"
type = "layers"
layers = [
    "runkk_ai.storage.pg_repository | runkk_ai.storage.coach_store | runkk_ai.storage.model_store | runkk_ai.storage.migrate",
    "runkk_ai.storage.engine | runkk_ai.storage.tables",
]

[[tool.importlinter.contracts]]
name = "writer는 runbody 결과를 읽기만 한다. 서버 모듈은 writer 학습 도구(dataset)를 모른다"
type = "forbidden"
source_modules = ["runkk_ai.core", "runkk_ai.comment", "runkk_ai.face", "runkk_ai.runbody"]
forbidden_modules = ["runkk_ai.writer"]

[[tool.importlinter.contracts]]
name = "writer: 라우터 → 학습 도구·서비스 → 모델 클라이언트·등록부 → 요약·지시문·검사 한 방향"
type = "layers"
layers = [
    "runkk_ai.writer.router",
    "runkk_ai.writer.dataset | runkk_ai.writer.service",
    "runkk_ai.writer.client | runkk_ai.writer.registry",
    "runkk_ai.writer.brief | runkk_ai.writer.prompt | runkk_ai.writer.checks",
]

[[tool.importlinter.contracts]]
name = "storage는 writer 모델 등록부 규약(writer.registry)만 구현한다"
type = "forbidden"
source_modules = ["runkk_ai.storage"]
forbidden_modules = [
    "runkk_ai.writer.router",
    "runkk_ai.writer.service",
    "runkk_ai.writer.client",
    "runkk_ai.writer.dataset",
    "runkk_ai.writer.brief",
    "runkk_ai.writer.prompt",
    "runkk_ai.writer.checks",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "coach는 runbody 결과를 읽기만 한다. 다른 모듈은 coach를 모른다"
type = "forbidden"
source_modules = ["runkk_ai.core", "runkk_ai.comment", "runkk_ai.face", "runkk_ai.runbody", "runkk_ai.writer", "runkk_ai.privacy"]
forbidden_modules = ["runkk_ai.coach"]

[[tool.importlinter.contracts]]
name = "storage는 코치 대화 저장소 규약(coach.store)만 구현한다"
type = "forbidden"
source_modules = ["runkk_ai.storage"]
forbidden_modules = [
    "runkk_ai.coach.router",
    "runkk_ai.coach.service",
    "runkk_ai.coach.model",
    "runkk_ai.coach.tools",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "coach: 라우터 → 서비스 → 모델·저장소·도구·지시문 → 요청 형식 한 방향"
type = "layers"
layers = [
    "runkk_ai.coach.router",
    "runkk_ai.coach.service",
    "runkk_ai.coach.model | runkk_ai.coach.store | runkk_ai.coach.tools | runkk_ai.coach.prompt",
    "runkk_ai.coach.schemas",
]
