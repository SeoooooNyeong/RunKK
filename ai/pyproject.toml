[project]
name = "runkk-ai"
version = "0.1.0"
description = "런크크 ai 서버: AI 코멘트(/comments), 셀카 얼굴 변환(/faces), RUN바디 1회 분석(/sessions). api 컨테이너만 부르는 내부 서비스"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.150.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "anthropic==1.15.0",
    "openai==3.35.1",
    "httpx==0.28.1",
    "anyio==4.15.1",
    "pandas==3.1.0",
    "numpy==2.5.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "import-linter==2.15",
    "mypy==2.4.0",
    "pandas-stubs==3.0.5.260914",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runkk_ai"]

# ---------- ruff ----------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["runkk_ai", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["runkk_ai", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PT", "T20", "LOG", "G"]
ignore = [
    "RUF001", # 한국어 문구의 전각 문자 경고
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers"]

[tool.coverage.run]
source = ["runkk_ai"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
packages = ["runkk_ai"]
strict = true
plugins = ["pydantic.mypy"]

# ---------- import-linter (13.3, 14장, D-60) ----------
[tool.importlinter]
root_package = "runkk_ai"

[[tool.importlinter.contracts]]
name = "core·comment·face·runbody는 서로 import하지 않는다 (D-60)"
type = "independence"
modules = ["runkk_ai.core", "runkk_ai.comment", "runkk_ai.face", "runkk_ai.runbody"]

[[tool.importlinter.contracts]]
name = "core·comment·face·runbody는 main을 import하지 않는다 (main → 기능 모듈 한 방향)"
type = "forbidden"
source_modules = ["runkk_ai.core", "runkk_ai.comment", "runkk_ai.face", "runkk_ai.runbody"]
forbidden_modules = ["runkk_ai.main"]

[[tool.importlinter.contracts]]
name = "comment: 라우터 → 서비스 → 추상 클라이언트 한 방향"
type = "layers"
layers = [
    "runkk_ai.comment.router",
    "runkk_ai.comment.service",
    "runkk_ai.comment.prompt | runkk_ai.comment.llm",
    "runkk_ai.comment.schemas",
]

[[tool.importlinter.contracts]]
name = "face: 라우터 → 서비스 → 추상 변환기 한 방향"
type = "layers"
layers = [
    "runkk_ai.face.router",
    "runkk_ai.face.service",
    "runkk_ai.face.transformer",
    "runkk_ai.face.schemas",
]

[[tool.importlinter.contracts]]
name = "runbody: 라우터 → 서비스 → 엔진·저장소 → 피드백 → 코칭·점수 → 지표·전처리 한 방향"
type = "layers"
layers = [
    "runkk_ai.runbody.router",
    "runkk_ai.runbody.service",
    "runkk_ai.runbody.engine | runkk_ai.runbody.repository",
    "runkk_ai.runbody.feedback",
    "runkk_ai.runbody.coaching | runkk_ai.runbody.scoring",
    "runkk_ai.runbody.metrics | runkk_ai.runbody.preprocess",
    "runkk_ai.runbody.schemas",
]
